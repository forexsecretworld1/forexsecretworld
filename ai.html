er) {\n    tbody.innerHTML = \"\u003ctr\u003e\u003ctd colspan='5'\u003eYou are not logged in\u003c/td\u003e\u003c/tr\u003e\";\n    return;\n  }\n\n  try {\n    // Step 1: get uid2 from /userInfo/{uid}/uid2\n    const userInfoRef = firebase.database().ref(\"userInfo/\" + user.uid + \"/uid2\");\n    const userInfoSnapshot = await userInfoRef.once(\"value\");\n\n    if (!userInfoSnapshot.exists()) {\n      tbody.innerHTML = \"\u003ctr\u003e\u003ctd colspan='5'\u003eNo user info found\u003c/td\u003e\u003c/tr\u003e\";\n      return;\n    }\n\n    const uid2 = userInfoSnapshot.val();\n\n    // Step 2: fetch user's data from /users/{uid2}\n    const userRef = firebase.database().ref(\"users/\" + uid2);\n    const userSnapshot = await userRef.once(\"value\");\n\n    if (!userSnapshot.exists()) {\n      tbody.innerHTML = \"\u003ctr\u003e\u003ctd colspan='5'\u003eNo trading account yet\u003c/td\u003e\u003c/tr\u003e\";\n      return;\n    }\n\n    const userData = userSnapshot.val();\n\n    // ✅ Check if the snapshot has valid fields\n    if (!userData || !userData.accountNumber) {\n      tbody.innerHTML = \"\u003ctr\u003e\u003ctd colspan='5'\u003eNo trading account yet\u003c/td\u003e\u003c/tr\u003e\";\n      return;\n    }\n\n    // Step 3: display the row (always use ForexSecretWorld as name)\n    const row = `\n      \u003ctr\u003e\n        \u003ctd\u003e\n          ${userData.accountNumber} \u003cbr\u003e\n          ForexSecretWorld\n        \u003c/td\u003e\n        \u003ctd\u003e$${Number(userData.balance).toFixed(2)}\u003c/td\u003e\n        \u003ctd\u003e\n          \u003cbutton id=\"viewBtn\" class=\"btn-action view\"\u003eView\u003c/button\u003e\n        \u003c/td\u003e\n        \u003ctd\u003e\n          \u003cinput type=\"password\" value=\"${userData.password}\" id=\"password-${uid2}\" readonly\u003e\n          \u003cbutton onclick=\"togglePassword('password-${uid2}')\" style=\"border:none; background:none; cursor:pointer;\"\u003e\n            👁️\n          \u003c/button\u003e\n        \u003c/td\u003e\n        \u003ctd\u003e${userData.appFee}\u003c/td\u003e\n      \u003c/tr\u003e\n    `;\n    tbody.insertAdjacentHTML(\"beforeend\", row);\n\n    // 🔹 Check for Peter Nkosi and attach correct redirect\n    const fullName = (userData.name || \"\").trim().toLowerCase();\n    const viewBtn = document.getElementById(\"viewBtn\");\n    viewBtn.onclick = () =\u003e {\n      if (fullName === \"peter michael nkosi\") {\n        window.location.href = \"phases2.html\";\n      } else {\n        window.location.href = \"phases.html\";\n      }\n    };\n\n  } catch (err) {\n    console.error(\"Error loading user data:\", err);\n    tbody.innerHTML = \"\u003ctr\u003e\u003ctd colspan='5'\u003eError loading user data\u003c/td\u003e\u003c/tr\u003e\";\n  }\n});\n\n// 🔹 Toggle password visibility\nwindow.togglePassword = function (id) {\n  const field = document.getElementById(id);\n  field.type = (field.type === \"password\") ? \"text\" : \"password\";\n}; \n\n\u003c/script\u003e ,\n\n\n"])</script><script>self.__next_f.push([1,"22:T2aa0,"])</script><script>self.__next_f.push([1,"\u003cthink\u003e\nThe user is describing a system where users request funds, and as an admin, they can approve requests by filling out a form with account details, which should be stored in a nested way under the user's login details.\n\n\n## Examining user system  \n- The system involves users submitting fund requests, which admins can approve.  \n- Approval requires filling out a form with account details, linked to user login information.  \n\n## Organizing data structure  \n- Account details should be stored in a nested structure under user login details.  \n- This setup ensures account information is tied to specific user profiles for management.\n\n## Organizing admin approval  \n- Admins approve fund requests by filling a form with account name, username, password, accountPassword, email, balance, and software fee.  \n- Approved details are stored as a nested node under user login information, linking to a unique trading account ID (uid2).\n\u003c/think\u003eBelow is a complete implementation for the admin-side approval process based on your description. I'll break it down step-by-step, including the assumptions I made, the code structure, and how it integrates with the existing user request submission and data retrieval logic you provided.\n\n### Key Assumptions and Design Decisions\n- **Data Structure Alignment**: \n  - The approval form collects: `accountName` (e.g., \"ForexSecretWorld\"), `username` (used as `accountNumber` in the display), `password` (the account password shown in the table), `accountPassword` (stored as an additional field, even if not displayed in the retrieval code—perhaps for future use), `email`, `balance`, and `softwareFee` (stored as `appFee` in the data).\n  - Storage follows your retrieval code's expectations:\n    - A nested node under the user's login details: `/userInfo/{uid}/uid2` (where `uid` is the user's Firebase Auth UID from the fund request).\n    - The actual account data is stored under `/users/{uid2}` (where `uid2` is a unique key generated during approval to avoid conflicts, e.g., if usernames aren't guaranteed unique).\n    - This overwrites any existing `/userInfo/{uid}/uid2` and `/users/{uid2}` for the user (as per your \"overwriting the existing one\" instruction).\n  - If the user already has a trading account (i.e., `uid2` exists), it will be overwritten with the new approval data.\n- **Admin Page Setup**: I'm assuming you have an admin dashboard page (e.g., `admin.html`) where pending requests are listed. This page requires the admin to be logged in (you can add Firebase Auth checks).\n- **Security/Access**: Only admins should access this page. You should implement role-based access (e.g., check if the logged-in user has an \"admin\" flag in their profile). For simplicity, I'm not including that here—add it as needed.\n- **Approval Flow**:\n  - Admins see a list of pending ded row (initially hidden)\n    const expandedRow = document.createElement(\"tr\");\n    expandedRow.classList.add(\"expanded-row\");\n    expandedRow.style.display = \"none\";\n    expandedRow.innerHTML = `\n      \u003ctd colspan=\"6\"\u003e\n        \u003cdiv class=\"expanded-content\"\u003e\n          \u003cp\u003e\u003cstrong\u003eFull Name:\u003c/strong\u003e ${req.fullName}\u003c/p\u003e\n          \u003cp\u003e\u003cstrong\u003eEmail:\u003c/strong\u003e ${req.email}\u003c/p\u003e\n          \u003cp\u003e\u003cstrong\u003eSubmitted At:\u003c/strong\u003e ${new Date(req.submittedAt).toLocaleString()}\u003c/p\u003e\n          \u003cp\u003e\u003cstrong\u003eStatus:\u003c/strong\u003e ${req.status || \"Pending\"}\u003c/p\u003e\n          \u003cp\u003e\u003cstrong\u003eUID:\u003c/strong\u003e ${req.uid}\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/td\u003e\n    `;\n    tbody.appendChild(expandedRow);\n\n    index++;\n  }\n});\n\n// 🔹 Toggle row expansion\nfunction toggleRowExpansion(row, req) {\n  const nextRow = row.nextElementSibling;\n  if (nextRow \u0026\u0026 nextRow.classList.contains(\"expanded-row\")) {\n    nextRow.style.display = nextRow.style.display === \"none\" ? \"table-row\" : \"none\";\n  }\n}\n\n// 🔹 Delete request and mark as rejected\nfunction deleteRequest(uid) {\n  if (confirm(\"Are you sure you want to delete this request? It will be marked as Rejected.\")) {\n    firebase.database().ref(`usersRequestingFunds/${uid}`).update({ status: \"Rejected\" })\n      .then(() =\u003e {\n        alert(\"Request marked as Rejected.\");\n      })\n      .catch(err =\u003e {\n        console.error(\"Error deleting request:\", err);\n        alert(\"Failed to delete request.\");\n      });\n  }\n}\n\n// 🔹 Open the approval modal and set the current UID, then auto-fill form fields\nfunction openApproveModal(uid) {\n  currentRequestUid = uid;\n  document.getElementById(\"approveModal\").style.display = \"block\";\n  document.getElementById(\"approveF n    tbody.appendChild(expandedRow);\n\n    index++;\n  }\n});\n\n// 🔹 Toggle row expansion\nfunction toggleRowExpansion(row, req) {\n  const nextRow = row.nextElementSibling;\n  if (nextRow \u0026\u0026 nextRow.classList.contains(\"expanded-row\")) {\n    nextRow.style.display = nextRow.style.display === \"none\" ? \"table-row\" : \"none\";\n  }\n}\n\n// 🔹 Delete request and mark as rejected\nfunction deleteRequest(uid) {\n  if (confirm(\"Are you sure you want to delete this request? It will be marked as Rejected.\")) {\n    firebase.database().ref(`usersRequestingFunds/${uid}`).update({ status: \"Rejected\" })\n      .then(() =\u003e {\n        alert(\"Request marked as Rejected.\");\n      })\n      .catch(err =\u003e {\n        console.error(\"Error deleting request:\", err);\n        alert(\"Failed to delete request.\");\n      });\n  }\n}\n\n// 🔹 Open the approval modal and set the current UID, then auto-fill form fields\nfunction openApproveModal(uid) {\n  currentRequestUid = uid;\n  document.getElementById(\"approveModal\").style.display = \"block\";\n  document.getElementById(\"approveForm\").reset(); // Reset form first\n\n  // Fetch the request data to auto-fill fields\n  firebase.database().ref(`usersRequestingFunds/${uid}`).once(\"value\")\n    .then(snapshot =\u003e {\n      const req = snapshot.val();\n      if (req) {\n        // Auto-fill from the requesting user's data\n        document.getElementById(\"email\").value = req.email || \"\"; // Email from request\n        document.getElementById(\"username\").value = req.fullName || \"\"; // Username as fullName (default)\n        // Note: Password cannot be auto-filled as it's not stored/retrievable from Firebase Auth or the request.\n        // Leave it blank for admin to set manually.\n      }\n    })\n    .catch(err =\u003e {\n      console.error(\"Error fetching request data:\", err);\n    });\n}\n\n// 🔹 Close the modal\nfunction closeModal() {\n  document.getElementById(\"approveModal\").style.display = \"none\";\n  currentRequestUid = null;\n  currentUid2 = null;\n}\n\n// 🔹 Handle form submission for approval\ndocument.getElementById(\"approveForm\").addEventListener(\"submit\", async function(e) {\n  e.preventDefault();\n\n  if (!currentRequestUid) {\n    alert(\"No request selected.\");\n    return;\n  }\n\n  // Collect form data\n  const accountName = document.getElementById(\"accountName\").value.trim();\n  const username = document.getElementById(\"username\").value.trim();\n  const password = document.getElementById(\"password\").value;\n  const accountPassword = document.getElementById(\"accountPassword\").value;\n  const email = document.getElementById(\"email\").value.trim();\n  const balance = parseFloat(document.getElementById(\"balance\").value);\n  const softwareFee = document.getElementById(\"softwareFee\").value; // \"Paid\" or \"Unpaid\"\n\n  if (isNaN(balance)) {\n    alert(\"Balance must be a valid number.\");\n    return;\n  }\n\n  if (!softwareFee) {\n    alert(\"Please select Paid or Unpaid for Software Fee.\");\n    return;\n  }\n\n  try {\n    // Generate a unique uid2 (push key for the trading account)\n    const uid2 = firebase.database().ref(\"users\").push().key;\n\n    // Prepare the account data to store under /users/{uid2}\n    const accountData = {\n      name: accountName,          // Account name (e.g., \"ForexSecretWorld\")\n      accountNumber: username,    // Username (displayed as account number)\n      password: password,         // Account password (shown in table)\n      accountPassword: accountPassword, // Additional password field\n      email: email,\n      balance: balance,\n      appFee: softwareFee         // Software fee (\"Paid\" or \"Unpaid\")\n    };\n\n    // Step 1: Set /userInfo/{currentRequestUid}/uid2 = uid2 (nested under user login details)\n    await firebase.database().ref(`userInfo/${currentRequestUid}/uid2`).set(uid2);\n\n    // Step 2: Set /users/{uid2} = accountData (overwrites any existing data for this uid2)\n    await firebase.database().ref(`users/${uid2}`).set(accountData);\n\n    // Step 3: Remove the request from /usersRequestingFunds (cleanup)\n    await firebase.database().ref(`usersRequestingFunds/${currentRequestUid}`).remove();\n\n    alert(\"Request approved successfully! The user's trading account has been set up.\");\n    closeModal(); // Close modal after success\n\n    // Refresh the trading accounts table\n    loadTradingAccounts();\n\n  } catch (err) {\n    console.error(\"Error approving request:\", err);\n    alert(\"Failed to approve request. Please try again.\");\n  }\n});\n\n// 🔹 Load and display trading accounts in the table (matching the Pending Orders structure)\nfunction loadTradingAccounts() {\n  const tradingTbody = document.querySelector(\"#tradingAccounts tbody\");\n  if (!tradingTbody) return; // If the table doesn't exist, skip\n\n  firebase.database().ref(\"users\").on(\"value\", snapshot =\u003e {\n    const users = snapshot.val();\n    tradingTbody.innerHTML = \"\"; // Clear previous rows\n\n    if (!users) {\n      tradingTbody.innerHTML = \"\u003ctr\u003e\u003ctd colspan='6'\u003eNo trading accounts.\u003c/td\u003e\u003c/tr\u003e\";\n      return;\n    }\n\n    let index = 1;\n    for (const uid2 in users) {\n      const user = users[uid2];\n      const row = document.createElement(\"tr\");\n      row.innerHTML = `\n        \u003ctd\u003e${index}\u003c/td\u003e  \u003c!-- Order ID / # --\u003e\n        \u003ctd\u003e${user.name || \"\"}\u003c/td\u003e  \u003c!-- Customer / Account Name --\u003e\n        \u003ctd\u003e${user.accountNumber || \"\"}\u003c/td\u003e  \u003c!-- Product / Account Number --\u003e\n        \u003ctd\u003e$${Number(user.balance).toFixed(2)}\u003c/td\u003e  \u003c!-- Price / Balance --\u003e\n        \u003ctd\u003e${user.appFee || \"\"}\u003c/td\u003e  \u003c!-- Status / Software Fee --\u003e\n        \u003ctd\u003e\u003cbutton onclick=\"openEditModal('${uid2}')\"\u003eEdit\u003c/button\u003e\u003c/td\u003e  \u003c!-- Action --\u003e\n      `;\n      tradingTbody.appendChild(row);\n      index++;\n    }\n  });\n}\n\n// 🔹 Open edit modal for trading account\nfunction openEditModal(uid2) {\n  currentUid2 = uid2;\n  document.getElementById(\"editModal\").style.display = \"block\";\n\n  // Fetch current data and pre-fill\n  firebase.database().ref(`users/${uid2}`).once(\"value\")\n    .then(snapshot =\u003e {\n      const user = snapshot.val();\n      if (user) {\n        document.getElementById(\"editAccountName\").value = user.name || \"\";\n        document.getElementById(\"editAccountPassword\").value = user.accountPassword || \"\";\n        document.getElementById(\"editBalance\").value = user.balance || \"\";\n        document.getElementById(\"editSoftwareFee\").value = user.appFee || \"\";\n      }\n    })\n    .catch(err =\u003e {\n      console.error(\"Error fetching account data:\", err);\n    });\n}\n\n// 🔹 Handle edit form submission (with null check to prevent errors)\nconst editForm = document.getElementById(\"editForm\");\nif (editForm) {\n  editForm.addEventListener(\"submit\", async function(e) {\n    e.preventDefault();\n\n    if (!currentUid2) {\n      alert(\"No account selected.\");\n      return;\n    }\n\n    const accountName = document.getElementById(\"editAccountName\").value.trim();\n    const accountPassword = document.getElementById(\"editAccountPassword\").value;\n    const balance = parseFloat(document.getElementById(\"editBalance\").value);\n    const softwareFee = document.getElementById(\"editSoftwareFee\").value;\n\n    if (isNaN(balance)) {\n      alert(\"Balance must be a valid number.\");\n      return;\n    }\n\n    try {\n      await firebase.database().ref(`users/${currentUid2}`).update({\n        name: accountName,\n        accountPassword: accountPassword,\n        balance: balance,\n        appFee: softwareFee\n      });\n      alert(\"Account updated successfully.\");\n      closeModal();\n      loadTradingAccounts(); // Refresh table\n    } catch (err) {\n      console.error(\"Error updating account:\", err);\n      alert(\"Failed to update account.\");\n    }\n  });\n} else {\n  console.error(\"Edit form not found in DOM. Ensure the edit modal is present in your HTML.\");\n}\n\n// 🔹 Initialize trading accounts table on load\nloadTradingAccounts();\n``` \n\n### Notes\n- **Fix for the Error**: Added a null check for `document.getElementById(\"editForm\")` before attaching the event listener. If the element doesn't exist, it logs an error to the console instead of crashing.\n- **HTML Requirement**: Ensure your `admin.html` includes the edit modal as shown in my previous response. If the modal is loaded dynamically (e.g., after the page loads), you may need to move this event listener inside the `openEditModal` function or use event delegation.\n- **Testing**: Open your browser's developer console (F12) and check for the error message. If \"Edit form not found in DOM\" appears, double-check your HTML. If everything works, the error should be resolved.\n- The rest of the code remains unchanged. If you need further adjustments, let me know!"])</script><script>self.__next_f.push([1,"29:T6d9,"])</script><script>self.__next_f.push([1,"```html\n\u003c!-- Edit Modal for Trading Accounts --\u003e\n\u003cdiv id=\"editModal\" style=\"display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);\"\u003e\n  \u003cdiv style=\"position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px;\"\u003e\n    \u003ch2\u003eEdit Trading Account\u003c/h2\u003e\n    \u003cform id=\"editForm\"\u003e\n      \u003clabel\u003eAccount Name: \u003cinput id=\"editAccountName\" required\u003e\u003c/label\u003e\u003cbr\u003e\n      \u003clabel\u003eAccount Password: \u003cinput id=\"editAccountPassword\" type=\"password\" required\u003e\u003c/label\u003e\u003cbr\u003e\n      \u003clabel\u003eBalance: \u00 \u003c/script\u003e\n\u003cscript src=\"https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"firebase.js\"\u003e\u003c/script\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700\u0026display=swap\" rel=\"stylesheet\"\u003e\n\u003cstyle\u003e\nbody { font-family: 'Poppins', sans-serif; background: #f9f9f9; margin: 0; }\n.header { background: radial-gradient(#fff,#ffd6d6); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }\n.header h2 { margin: 0; color: #ff523b; }\n.container { max-width: 1200px; margin: auto; padding: 20px; }\ninput, select, textarea, button { padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; width: 100%; }\ntextarea { resize: vertical; }\nbutton { background: #ff523b; color: white; border: none; cursor: pointer; transition: 0.3s; }\nbutton:hover { background: #563434; }\ntable { width: 100%; border-collapse: collapse; margin-top: 20px; }\nth, td { padding: 10px; border-bottom: 1px solid #ccc; text-align: left; }\nth { background: #ff523b; color: white; }\n.product-image { width: 80px; height: 80px; object-fit: cover; border-radius: 5px; }\n.tabs { display: flex; margin-bottom: 20px; }\n.tab { padding: 10px 20px; cursor: pointer; border: 1px solid #ff523b; border-bottom: none; background: #fff; margin-right: 5px; border-top-left-radius: 5px; border-top-right-radius: 5px; }\n.tab.active { background: #ff523b; color: #fff; }\n.tab-content { display: none; background: #fff; padding: 20px; border: 1px solid #ff523b; border-radius: 5px; }\n.tab-content.active { display: block; }\n.toast { position: fixed; top: 20px; right: 20px; background: #ff523b; color: white; padding: 10px 20px; border-radius: 5px; display: none; z-index: 9999; }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody 03c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n  \u003c!-- Pending Orders Tab --\u003e\n  \u003cdiv id=\"pendingTab\" class=\"tab-content\"\u003e\n    \u003ch3\u003ePending Orders\u003c/h3\u003e\n    \u003ctable id=\"ordersTable\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\n          \u003cth\u003eOrder ID\u003c/th\u003e\n          \u003cth\u003eCustomer\u003c/th\u003e\n          \u003cth\u003eProduct\u003c/th\u003e\n          \u003cth\u003ePrice\u003c/th\u003e\n          \u003cth\u003eStatus\u003c/th\u003e\n          \u003cth\u003eAction\u003c/th\u003e\n        \u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n\n  \u003c!-- RequestFunds Tab --\u003e\n  \u003cdiv id=\"RequestFunds\" class=\"tab-content\"\u003e\n    \u003ch3\u003ePending \u003c/h3\u003e\n    \u003ctable id=\"propfirm\"\u003e\n  \u003cthead\u003e\n    \u003ctr\u003e\n      \u003cth\u003e#\u003c/th\u003e\n      \u003cth\u003eUser\u003c/th\u003e\n      \u003cth\u003eEmail\u003c/th\u003e\n      \u003cth\u003eSubmitted\u003c/th\u003e\n      \u003cth\u003eStatus\u003c/th\u003e\n      \u003cth\u003eAction\u003c/th\u003e\n    \u003c/tr\u003e\n  \u003c/thead\u003e\n  \u003ctbody\u003e\u003c/tbody\u003e\n\u003c/table\u003e\n\n  \u003c/div\u003e\n\n\u003c/div\u003e\n\n\u003cdiv class=\"toast\" id=\"toast\"\u003e\u003c/div\u003e\n\n\n  \u003c!-- Modal for approval form --\u003e\n  \u003cdiv id=\"approveModal\" style=\"display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);\"\u003e\n    \u003cdiv style=\"position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px;\"\u003e\n      \u003ch2\u003eApprove Request\u003c/h2\u003e\n      \u003cform id=\"approveForm\"\u003e\n        \u003clabel\u003eAccount Name: \u003cinput id=\"accountName\" required\u003e\u003c/label\u003e\u003cbr\u003e\n        \u003clabel\u003eUsername: \u003cinput id=\"username\" required\u003e\u003c/label\u003e\u003cbr\u003e\n        \u003clabel\u003ePassword: \u003cinput id=\"password\" type=\"password\" required\u003e\u003c/label\u003e\u003cbr\u003e\n        \u003clabel\u003eAccount Password: \u003cinput id=\"accountPassword\" type=\"password\" required\u003e\u003c/label\u003e\u003cbr\u003e\n        \u003clabel\u003eEmail: \u003cinput id=\"email\" type=\"email\" required\u003e\u003c/label\u003e\u003cbr\u003e\n        \u003clabel\u003eBalance: \u003cinput id=\"balance\" type=\"number\" step=\"0.01\" required\u003e\u003c/label\u003e\u003cbr\u003e\n        \u003clabel\u003eSoftware Fee: \n          \u003cselect id=\"softwareFee\" required\u003e\n            \u003coption value=\"\"\u003eSelect\u003c/option\u003e\n            \u003coption value=\"Paid\"\u003ePaid\u003c/option\u003e\n            \u003coption value=\"Unpaid\"\u003eUnpaid\u003c/option\u003e\n          \u003c/select\u003e\n        \u003c/label\u003e\u003cbr\u003e\n        \u003cbutton type=\"submit\"\u003eApprove\u003c/button\u003e\n        \u003cbutton type=\"button\" onclick=\"closeModal()\"\u003eCancel\u003c/button\u003e\n      \u003c/form\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n\u003c!-- Edit Modal for Trading Accounts --\u003e\n\u003cdiv id=\"editModal\" style=\"display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);\"\u003e\n  \u003cdiv style=\"position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px;\"\u003e\n    \u003ch2\u003eEdit Trading Account\u003c/h2\u003e\n    \u003cform id=\"editForm\"\u003e\n      \u003clabel\u003eAccount Name: \u003cinput id=\"editAccountName\" required\u003e\u003c/label\u003e\u003cbr\u003e\n      \u003clabel\u003eAccount Password: \u003cinput id=\"editAccountPassword\" type=\"password\" required\u003e\u003c/label\u003e\u003cbr\u003e\n      \u003clabel\u003eBalance: \u003cinput id=\"editBalance\" type=\"number\" step=\"0.01\" required\u003e\u003c/label\u003e\u003cbr\u003e\n      \u003clabel\u003eSoftware Fee: \n        \u003cselect id=\"editSoftwareFee\" required\u003e\n          \u003coption value=\"\"\u003eSelect\u003c/option\u003e\n          \u003coption value=\"Paid\"\u003ePaid\u003c/option\u003e\n          \u003coption value=\"Unpaid\"\u003eUnpaid\u003c/option\u003e\n        \u003c/select\u003e\n      \u003c/label\u003e\u003cbr\u003e\n      \u003cbutton type=\"submit\"\u003eUpdate\u003c/button\u003e\n      \u003cbutton type=\"button\" onclick=\"closeModal()\"\u003eCancel\u003c/button\u003e\n    \u003c/form\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003cscript\u003e\n \n// Global variable to track the current request UID being approved or edited\nlet currentRequestUid = null;\nlet currentUid2 = null; // For editing trading accounts\n\n// 🔹 Load and display pending requests in the table on page load\nfirebase.database().ref(\"usersRequestingFunds\").on(\"value\", snapshot =\u003e {\n  const requests = snapshot.val();\n  const tbody = document.querySelector(\"#propfirm tbody\");\n  tbody.innerHTML = \"\"; // Clear previous rows\n\n  if (!requests) {\n    // No requests: Add a single row spanning all columns\n    tbody.innerHTML = \"\u003ctr\u003e\u003ctd colspan='6'\u003eNo pending requests.\u003c/td\u003e\u003c/tr\u003e\";\n    return;\n  }\n\n  let index = 1; // For the # column (serial number)\n  for (const uid in requests) {\n    const req = requests[uid];\n    const row = document.createElement(\"tr\");\n    row.classList.add(\"clickable-row\"); // Add class for styling/click handling\n    row.innerHTML = `\n      \u003ctd\u003e${index}\u003c/td\u003e\n      \u003ctd\u003e${req.fullName}\u003c/td\u003e\n      \u003ctd\u003e${req.email}\u003c/td\u003e\n      \u003ctd\u003e${new Date(req.submittedAt).toLocaleString()}\u003c/td\u003e\n      \u003ctd\u003e${req.status || \"Pending\"}\u003c/td\u003e\n      \u003ctd\u003e\n        \u003cbutton onclick=\"openApproveModal('${uid}')\"\u003eApprove\u003c/button\u003e\n        \u003cbutton onclick=\"deleteRequest('${uid}')\"\u003eDelete\u003c/button\u003e\n      \u003c/td\u003e\n    `;\n    // Add click handler for expansion\n    row.addEventListener(\"click\", () =\u003e toggleRowExpansion(row, req));\n    tbody.appendChild(row);\n\n    // Hidden expanded row (initially hidden)\n    const expandedRow = document.createElement(\"tr\");\n    expandedRow.classList.add(\"expanded-row\");\n    expandedRow.style.display = \"none\";\n    expandedRow.innerHTML = `\n      \u003ctd colspan=\"6\"\u003e\n        \u003cdiv class=\"expanded-content\"\u003e\n          \u003cp\u003e\u003cstrong\u003eFull Name:\u003c/strong\u003e ${req.fullName}\u003c/p\u003e\n          \u003cp\u003e\u003cstrong\u003eEmail:\u003c/strong\u003e ${req.email}\u003c/p\u003e\n          \u003cp\u003e\u003cstrong\u003eSubmitted At:\u003c/strong\u003e ${new Date(req.submittedAt).toLocaleString()}\u003c/p\u003e\n          \u003cp\u003e\u003cstrong\u003eStatus:\u003c/strong\u003e ${req.status || \"Pending\"}\u003c/p\u003e\n          \u003cp\u003e\u003cstrong\u003eUID:\u003c/strong\u003e ${req.uid}\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/td\u003e\n    `;\n    tbody.appendChild(expandedRow);\n\n    index++;\n  }\n});\n\n// 🔹 Toggle row expansion\nfunction toggleRowExpansion(row, req) {\n  const nextRow = row.nextElementSibling;\n  if (nextRow \u0026\u0026 nextRow.classList.contains(\"expanded-row\")) {\n    nextRow.style.display = nextRow.style.display === \"none\" ? \"table-row\" : \"none\";\n  }\n}\n\n// 🔹 Delete request and mark as rejected\nfunction deleteRequest(uid) {\n  if (confirm(\"Are you sure you want to delete this request? It will be marked as Rejected.\")) {\n    firebase.database().ref(`usersRequestingFunds/${uid}`).update({ status: \"Rejected\" })\n      .then(() =\u003e {\n        alert(\"Request marked as Rejected.\");\n      })\n      .catch(err =\u003e {\n        console.error(\"Error deleting request:\", err);\n        alert(\"Failed to delete request.\");\n      });\n  }\n}\n\n// 🔹 Open the approval modal and set the current UID, then auto-fill form fields\nfunction openApproveModal(uid) {\n  currentRequestUid = uid;\n  document.getElementById(\"approveModal\").style.display = \"block\";\n  document.getElementById(\"approveForm\").reset(); // Reset form first\n\n  // Fetch the request data to auto-fill fields\n  firebase.database().ref(`usersRequestingFunds/${uid}`).once(\"value\")\n    .then(snapshot =\u003e {\n      const req = snapshot.val();\n      if (req) {\n        // Auto-fill from the requesting user's data\n        document.getElementById(\"email\").value = req.email || \"\"; // Email from request\n        document.getElementById(\"username\").value = req.fullName || \"\"; // Username as fullName (default)\n        // Note: Password cannot be auto-filled as it's not stored/retrievable from Firebase Auth or the request.\n        // Leave it blank for admin to set manually.\n      }\n    })\n    .catch(err =\u003e {\n      console.error(\"Error fetching request data:\", err);\n    });\n}\n\n// 🔹 Close the modal\nfunction closeModal() {\n  document.getElementById(\"approveModal\").style.display = \"none\";\n  currentRequestUid = null;\n  currentUid2 = null;\n}\n\n// 🔹 Handle form submission for approval\ndocument.getElementById(\"approveForm\").addEventListener(\"submit\", async function(e) {\n  e.preventDefault();\n\n  if (!currentRequestUid) {\n    alert(\"No request selected.\");\n    return;\n  }\n\n  // Collect form data\n  const accountName = document.getElementById(\"accountName\").value.trim();\n  const username = document.getElementById(\"username\").value.trim();\n  const password = document.getElementById(\"password\").value;\n  const accountPassword = document.getElementById(\"accountPassword\").value;\n  const email = document.getElementById(\"email\").value.trim();\n  const balance = parseFloat(document.getElementById(\"balance\").value);\n  const softwareFee = document.getElementById(\"softwareFee\").value; // \"Paid\" or \"Unpaid\"\n\n  if (isNaN(balance)) {\n    alert(\"Balance must be a valid number.\");\n    return;\n  }\n\n  if (!softwareFee) {\n    alert(\"Please select Paid or Unpaid for Software Fee.\");\n    return;\n  }\n\n  try {\n    // Generate a unique uid2 (push key for the trading account)\n    const uid2 = firebase.database().ref(\"users\").push().key;\n\n    // Prepare the account data to store under /users/{uid2}\n    const accountData = {\n      name: accountName,          // Account name (e.g., \"ForexSecretWorld\")\n      accountNumber: username,    // Username (displayed as account number)\n      password: password,         // Account password (shown in table)\n      accountPassword: accountPassword, // Additional password field\n      email: email,\n      balance: balance,\n      appFee: softwareFee         // Software fee (\"Paid\" or \"Unpaid\")\n    };\n\n    // Step 1: Set /userInfo/{currentRequestUid}/uid2 = uid2 (nested under user login details)\n    await firebase.database().ref(`userInfo/${currentRequestUid}/uid2`).set(uid2);\n\n    // Step 2: Set /users/{uid2} = accountData (overwrites any existing data for this uid2)\n    await firebase.database().ref(`users/${uid2}`).set(accountData);\n\n    // Step 3: Remove the request from /usersRequestingFunds (cleanup)\n    await firebase.database().ref(`usersRequestingFunds/${currentRequestUid}`).remove();\n\n    alert(\"Request approved successfully! The user's trading account has been set up.\");\n    closeModal(); // Close modal after success\n\n    // Refresh the trading accounts table\n    loadTradingAccounts();\n\n  } catch (err) {\n    console.error(\"Error approving request:\", err);\n    alert(\"Failed to approve request. Please try again.\");\n  }\n});\n\n// 🔹 Load and display trading accounts in the table (matching the Pending Orders structure)\nfunction loadTradingAccounts() {\n  const tradingTbody = document.querySelector(\"#tradingAccounts tbody\");\n  if (!tradingTbody) return; // If the table doesn't exist, skip\n\n  firebase.database().ref(\"users\").on(\"value\", snapshot =\u003e {\n    const users = snapshot.val();\n    tradingTbody.innerHTML = \"\"; // Clear previous rows\n\n    if (!users) {\n      tradingTbody.innerHTML = \"\u003ctr\u003e\u003ctd colspan='6'\u003eNo trading accounts.\u003c/td\u003e\u003c/tr\u003e\";\n      return;\n    }\n\n    let index = 1;\n    for (const uid2 in users) {\n      const user = users[uid2];\n      const row = document.createElement(\"tr\");\n      row.innerHTML = `\n        \u003ctd\u003e${index}\u003c/td\u003e  \u003c!-- Order ID / # --\u003e\n        \u003ctd\u003e${user.name || \"\"}\u003c/td\u003e  \u003c!-- Customer / Account Name --\u003e\n        \u003ctd\u003e${user.accountNumber || \"\"}\u003c/td\u003e  \u003c!-- Product / Account Number --\u003e\n        \u003ctd\u003e$${Number(user.balance).toFixed(2)}\u003c/td\u003e  \u003c!-- Price / Balance --\u003e\n        \u003ctd\u003e${user.appFee || \"\"}\u003c/td\u003e  \u003c!-- Status / Software Fee --\u003e\n        \u003ctd\u003e\u003cbutton onclick=\"openEditModal('${uid2}')\"\u003eEdit\u003c/button\u003e\u003c/td\u003e  \u003c!-- Action --\u003e\n      `;\n      tradingTbody.appendChild(row);\n      index++;\n    }\n  });\n}\n\n// 🔹 Open edit modal for trading account\nfunction openEditModal(uid2) {\n  currentUid2 = uid2;\n  document.getElementById(\"editModal\").style.display = \"block\";\n\n  // Fetch current data and pre-fill\n  firebase.database().ref(`users/${uid2}`).once(\"value\")\n    .then(snapshot =\u003e {\n      const user = snapshot.val();\n      if (user) {\n        document.getElementById(\"editAccountName\").value = user.name || \"\";\n        document.getElementById(\"editAccountPassword\").value = user.accountPassword || \"\";\n        document.getElementById(\"editBalance\").value = user.balance || \"\";\n        document.getElementById(\"editSoftwareFee\").value = user.appFee || \"\";\n      }\n    })\n    .catch(err =\u003e {\n      console.error(\"Error fetching account data:\", err);\n    });\n}\n\n// 🔹 Handle edit form submission\ndocument.getElementById(\"editForm\").addEventListener(\"submit\", async function(e) {\n  e.preventDefault();\n\n  if (!currentUid2) {\n    alert(\"No account selected.\");\n    return;\n  } \n\n  const accountName = document.getElementById(\"editAccountName\").value.trim();\n  const accountPassword = document.getElementById(\"editAccountPassword\").value;\n  const balance = parseFloat(document.getElementById(\"editBalance\").value);\n  const softwareFee = document.getElementById(\"editSoftwareFee\").value;\n\n  if (isNaN(balance)) {\n    alert(\"Balance must be a valid number.\");\n    return;\n  }\n\n  try {\n    await firebase.database().ref(`users/${currentUid2}`).update({\n      name: accountName,\n      accountPassword: accountPassword,\n      balance: balance,\n      appFee: softwareFee\n    });\n    alert(\"Account updated successfully.\");\n    closeModal();\n    loadTradingAccounts(); // Refresh table\n  } catch (err) {\n    console.error(\"Error updating account:\", err);\n    alert(\"Failed to update account.\");\n  }\n});\n\n// 🔹 Initialize trading accounts table on load\nloadTradingAccounts();\n///end\nfunction openTab(tabId) {\n  document.querySelectorAll('.tab').forEach(tab =\u003e tab.classList.remove('active'));\n  document.querySelectorAll('.tab-content').forEach(tc =\u003e tc.classList.remove('active'));\n  event.currentTarget.classList.add('active');\n  document.getElementById(tabId).classList.add('active');\n}\n\n\n// Products CRUD (your existing code)\nfunction addOrUpdateProduct() { /* ...existing code here... */ }\n// Load products\ndb.ref('products').on('value', snapshot =\u003e {\n  const tbody = document.querySelector('#productsTable tbody');\n  tbody.innerHTML = '';\n  snapshot.forEach(child =\u003e {\n    const data = child.val();\n    const tr = document.createElement('tr');\n    tr.innerHTML = `\n      \u003ctd\u003e\u003cimg src=\"${data.image}\" class=\"product-image\"\u003e\u003c/td\u003e\n      \u003ctd\u003e${data.name}\u003c/td\u003e\n      \u003ctd\u003e${data.category}\u003c/td\u003e\n      \u003ctd\u003e$${data.price}\u003c/td\u003e\n      \u003ctd\u003e\n        \u003cbutton onclick=\"editProduct('${child.key}','${data.name}','${data.description}','${data.price}','${data.category}')\"\u003eEdit\u003c/button\u003e\n        \u003cbutton onclick=\"deleteProduct('${child.key}','${data.image}')\"\u003eDelete\u003c/button\u003e\n      \u003c/td\u003e\n    `;\n    tbody.appendChild(tr);\n  });\n});\n\n// Pending orders\ndb.ref('orders').orderByChild('status').equalTo('pending').on('value', snapshot =\u003e {\n  const tbody = document.querySelector('#ordersTable tbody');\n  tbody.innerHTML = '';\n  snapshot.forEach(child =\u003e {\n    const data = child.val();\n    const tr = document.createElement('tr');\n    tr.innerHTML = `\n      \u003ctd\u003e${child.key}\u003c/td\u003e\n      \u003ctd\u003e${data.customerName}\u003c/td\u003e\n      \u003ctd\u003e${data.productName}\u003c/td\u003e\n      \u003ctd\u003e$${data.price}\u003c/td\u003e\n      \u003ctd\u003e${data.status}\u003c/td\u003e\n      \u003ctd\u003e\u003cbutton onclick=\"markOrderCompleted('${child.key}')\"\u003eMark Completed\u003c/button\u003e\u003c/td\u003e\n    `;\n    tbody.appendChild(tr);\n  });\n});\n\n// Mark order completed\nfunction markOrderCompleted(orderId) {\n  db.ref('orders/' + orderId).update({ status: 'completed' })\n    .then(() =\u003e showToast('Order marked as completed'))\n    .catch(err =\u003e showToast(err.message));\n}\n\u003c/script\u003e\n\n\u003c/body\u003e\n\u003c/html\u003ethis is my full admin code,, i want to see the approved funds request in new tabs and account information in the new tab"])</script><script>self.__next_f.push([1,"2b:T3f9f,"])</script><script>self.__next_f.push([1,"\u003cthink\u003e\nFirst, the user has provided their full admin.html code. They want to see the approved funds requests in a new tab, and account information in another new tab.\n\n\n## Reviewing user request  \n- The user submitted their full admin.html code and wants to view approved funds requests in a new tab.  \n- They also requested account information to be displayed in another new tab.\n\u003c/think\u003eBelow is the updated full `admin.html` code based on your provided file. I've made the following key changes to address your request:\n\n### Key Changes and Additions\n- **New Tabs Added**:\n  - Added a new tab called \"Trading Accounts\" (next to the existing tabs). This tab displays the trading accounts table (using the `loadTradingAccounts` function from the JS). This represents the \"account information\" for approved requests (since approved requests are removed from `/usersRequestingFunds` after approval, the trading accounts are the resulting data).\n  - For \"approved funds request\", since approved requests are removed from the database (as per the code), I interpreted this as showing the trading accounts (which are the outcome of approvals). If you meant something else (e.g., keeping approved requests in a separate node for history), let me know for adjustments.\n- **HTML Structure**:\n  - Added the new tab button in the `.tabs` div.\n  - Added the new tab content div (`#tradingTab`) with the trading accounts table, matching the \"Pending Orders\" structure as requested.\n  - The trading accounts table has columns: Order ID (#), Customer (Account Name), Product (Account Number), Price (Balance), Status (Software Fee), Action (Edit button).\n- **JavaScript**:\n  - No major changes to the existing JS (kept your products/orders logic intact).\n  - The `loadTradingAccounts` function now targets the new `#tradingAccounts` table in the new tab.\n  - Added a call to `loadTradingAccounts()` in the `openTab` function to load data when the tab is clicked (for real-time updates).\n- **Styling/Behavior**:\n  - The new tab follows the same CSS classes as existing tabs.\n  - Clicking the \"Trading Accounts\" tab will load and display the accounts.\n  - The edit modal is already included and works with the table.\n- **Assumptions**:\n  - Approved requests are not shown in a separate tab because they are removed from `/usersRequestingFunds`. If you want to keep them (e.g., in a new node like `/approvedRequests`), I can add that.\n  - If \"approved funds request\" means showing rejected requests or all requests, let me know.\n\n### Updated Full Code\n```html\n\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"UTF-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n\u003ctitle\u003eAdmin Panel - Forex Secret World\u003c/title\u003e\n\u003c!-- Firebase --\u003e\n\u003cscript src=\"https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"firebase.js\"\u003e\u003c/script\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700\u0026display=swap\" rel=\"stylesheet\"\u003e\n\u003cstyle\u003e\nbody { font-family: 'Poppins', sans-serif; background: #f9f9f9; margin: 0; }\n.header { background: radial-gradient(#fff,#ffd6d6); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }\n.header h2 { margin: 0; color: #ff523b; }\n.container { max-width: 1200px; margin: auto; padding: 20px; }\ninput, select, textarea, button { padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; width: 100%; }\ntextarea { resize: vertical; }\nbutton { background: #ff523b; color: white; border: none; cursor: pointer; transition: 0.3s; }\nbutton:hover { background: #563434; }\ntable { width: 100%; border-collapse: collapse; margin-top: 20px; }\nth, td { padding: 10px; border-bottom: 1px solid #ccc; text-align: left; }\nth { background: #ff523b; color: white; }\n.product-image { width: 80px; height: 80px; object-fit: cover; border-radius: 5px; }\n.tabs { display: flex; margin-bottom: 20px; }\n.tab { padding: 10px 20px; cursor: pointer; border: 1px solid #ff523b; border-bottom: none; background: #fff; margin-right: 5px; border-top-left-radius: 5px; border-top-right-radius: 5px; }\n.tab.active { background: #ff523b; color: #fff; }\n.tab-content { display: none; background: #fff; padding: 20px; border: 1px solid #ff523b; border-radius: 5px; }\n.tab-content.active { display: block; }\n.toast { position: fixed; top: 20px; right: 20px; background: #ff523b; color: white; padding: 10px 20px; border-radius: 5px; display: none; z-index: 9999; }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n\u003cdiv class=\"header\"\u003e\n  \u003ch2\u003eAdmin Panel\u003c/h2\u003e\n\u003c/div\u003e\n\n\u003cdiv class=\"container\"\u003e\n\n  \u003c!-- Tabs --\u003e\n  \u003cdiv class=\"tabs\"\u003e\n    \u003cdiv class=\"tab active\" onclick=\"openTab('productsTab')\"\u003eExisting Products\u003c/div\u003e\n    \u003cdiv class=\"tab\" onclick=\"openTab('pendingTab')\"\u003ePending Orders\u003c/div\u003e\n    \u003cdiv class=\"tab\" onclick=\"openTab('RequestFunds')\"\u003eRequest\u003c/div\u003e\n    \u003cdiv class=\"tab\" onclick=\"openTab('tradingTab')\"\u003eTrading Accounts\u003c/div\u003e  \u003c!-- New tab for trading accounts --\u003e\n  \u003c/div\u003e\n\n  \u003c!-- Existing Products Tab --\u003e\n  \u003cdiv id=\"productsTab\" class=\"tab-content active\"\u003e\n    \u003ch3\u003eAdd / Update Product\u003c/h3\u003e\n    \u003cinput type=\"hidden\" id=\"productId\"\u003e\n    \u003cinput type=\"text\" id=\"productName\" placeholder=\"Product Name\"\u003e\n    \u003ctextarea id=\"productDesc\" placeholder=\"Product Description\"\u003e\u003c/textarea\u003e\n    \u003cinput type=\"number\" id=\"productPrice\" placeholder=\"Price in USD\"\u003e\n    \u003cinput type=\"file\" id=\"productImageFile\"\u003e\n    \u003cselect id=\"productCategory\"\u003e\n      \u003coption value=\"\"\u003eSelect Category\u003c/option\u003e\n      \u003coption value=\"books\"\u003eBooks\u003c/option\u003e\n      \u003coption value=\"indicators\"\u003eIndicators\u003c/option\u003e\n      \u003coption value=\"robots\"\u003eRobots\u003c/option\u003e\n      \u003coption value=\"combos\"\u003eCombos\u003c/option\u003e\n    \u003c/select\u003e\n    \u003cbutton onclick=\"addOrUpdateProduct()\"\u003eAdd / Update Product\u003c/button\u003e\n\n    \u003ch3\u003eExisting Products\u003c/h3\u003e\n    \u003ctable id=\"productsTable\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\n          \u003cth\u003eImage\u003c/th\u003e\n          \u003cth\u003eName\u003c/th\u003e\n          \u003cth\u003eCategory\u003c/th\u003e\n          \u003cth\u003ePrice\u003c/th\u003e\n          \u003cth\u003eActions\u003c/th\u003e\n        \u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n\n  \u003c!-- Pending Orders Tab --\u003e\n  \u003cdiv id=\"pendingTab\" class=\"tab-content\"\u003e\n    \u003ch3\u003ePending Orders\u003c/h3\u003e\n    \u003ctable id=\"ordersTable\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\n          \u003cth\u003eOrder ID\u003c/th\u003e\n          \u003cth\u003eCustomer\u003c/th\u003e\n          \u003cth\u003eProduct\u003c/th\u003e\n          \u003cth\u003ePrice\u003c/th\u003e\n          \u003cth\u003eStatus\u003c/th\u003e\n          \u003cth\u003eAction\u003c/th\u003e\n        \u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n\n  \u003c!-- RequestFunds Tab --\u003e\n  \u003cdiv id=\"RequestFunds\" class=\"tab-content\"\u003e\n    \u003ch3\u003ePending\u003c/h3\u003e\n    \u003ctable id=\"propfirm\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\n          \u003cth\u003e#\u003c/th\u003e\n          \u003cth\u003eUser\u003c/th\u003e\n          \u003cth\u003eEmail\u003c/th\u003e\n          \u003cth\u003eSubmitted\u003c/th\u003e\n          \u003cth\u003eStatus\u003c/th\u003e\n          \u003cth\u003eAction\u003c/th\u003e\n        \u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n\n  \u003c!-- New Trading Accounts Tab --\u003e\n  \u003cdiv id=\"tradingTab\" class=\"tab-content\"\u003e\n    \u003ch3\u003eTrading Accounts\u003c/h3\u003e\n    \u003ctable id=\"tradingAccounts\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\n          \u003cth\u003eOrder ID\u003c/th\u003e\n          \u003cth\u003eCustomer\u003c/th\u003e\n          \u003cth\u003eProduct\u003c/th\u003e\n          \u003cth\u003ePrice\u003c/th\u003e\n          \u003cth\u003eStatus\u003c/th\u003e\n          \u003cth\u003eAction\u003c/th\u003e\n        \u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n\n\u003c/div\u003e\n\n\u003cdiv class=\"toast\" id=\"toast\"\u003e\u003c/div\u003e\n\n  \u003c!-- Modal for approval form --\u003e\n  \u003cdiv id=\"approveModal\" style=\"display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);\"\u003e\n    \u003cdiv style=\"position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px;\"\u003e\n      \u003ch2\u003eApprove Request\u003c/h2\u003e\n      \u003cform id=\"approveForm\"\u003e\n        \u003clabel\u003eAccount Name: \u003cinput id=\"accountName\" required\u003e\u003c/label\u003e\u003cbr\u003e\n        \u003clabel\u003eUsername: \u003cinput id=\"username\" required\u003e\u003c/label\u003e\u003cbr\u003e\n        \u003clabel\u003ePassword: \u003cinput id=\"password\" type=\"password\" required\u003e\u003c/label\u003e\u003cbr\u003e\n        \u003clabel\u003eAccount Password: \u003cinput id=\"accountPassword\" type=\"password\" required\u003e\u003c/label\u003e\u003cbr\u003e\n        \u003clabel\u003eEmail: \u003cinput id=\"email\" type=\"email\" required\u003e\u003c/label\u003e\u003cbr\u003e\n        \u003clabel\u003eBalance: \u003cinput id=\"balance\" type=\"number\" step=\"0.01\" required\u003e\u003c/label\u003e\u003cbr\u003e\n        \u003clabel\u003eSoftware Fee: \n          \u003cselect id=\"softwareFee\" required\u003e\n            \u003coption value=\"\"\u003eSelect\u003c/option\u003e\n            \u003coption value=\"Paid\"\u003ePaid\u003c/option\u003e\n            \u003coption value=\"Unpaid\"\u003eUnpaid\u003c/option\u003e\n          \u003c/select\u003e\n        \u003c/label\u003e\u003cbr\u003e\n        \u003cbutton type=\"submit\"\u003eApprove\u003c/button\u003e\n        \u003cbutton type=\"button\" onclick=\"closeModal()\"\u003eCancel\u003c/button\u003e\n      \u003c/form\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n\u003c!-- Edit Modal for Trading Accounts --\u003e\n\u003cdiv id=\"editModal\" style=\"display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);\"\u003e\n  \u003cdiv style=\"position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px;\"\u003e\n    \u003ch2\u003eEdit Trading Account\u003c/h2\u003e\n    \u003cform id=\"editForm\"\u003e\n      \u003clabel\u003eAccount Name: \u003cinput id=\"editAccountName\" required\u003e\u003c/label\u003e\u003cbr\u003e\n      \u003clabel\u003eAccount Password: \u003cinput id=\"editAccountPassword\" type=\"password\" required\u003e\u003c/label\u003e\u003cbr\u003e\n      \u003clabel\u003eBalance: \u003cinput id=\"editBalance\" type=\"number\" step=\"0.01\" required\u003e\u003c/label\u003e\u003cbr\u003e\n      \u003clabel\u003eSoftware Fee: \n        \u003cselect id=\"editSoftwareFee\" required\u003e\n          \u003coption value=\"\"\u003eSelect\u003c/option\u003e\n          \u003coption value=\"Paid\"\u003ePaid\u003c/option\u003e\n          \u003coption value=\"Unpaid\"\u003eUnpaid\u003c/option\u003e\n        \u003c/select\u003e\n      \u003c/label\u003e\u003cbr\u003e\n      \u003cbutton type=\"submit\"\u003eUpdate\u003c/button\u003e\n      \u003cbutton type=\"button\" onclick=\"closeModal()\"\u003eCancel\u003c/button\u003e\n    \u003c/form\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\n\u003cscript\u003e\n \n// Global variable to track the current request UID being approved or edited\nlet currentRequestUid = null;\nlet currentUid2 = null; // For editing trading accounts\n\n// 🔹 Load and display pending requests in the table on page load\nfirebase.database().ref(\"usersRequestingFunds\").on(\"value\", snapshot =\u003e {\n  const requests = snapshot.val();\n  const tbody = document.querySelector(\"#propfirm tbody\");\n  tbody.innerHTML = \"\"; // Clear previous rows\n\n  if (!requests) {\n    // No requests: Add a single row spanning all columns\n    tbody.innerHTML = \"\u003ctr\u003e\u003ctd colspan='6'\u003eNo pending requests.\u003c/td\u003e\u003c/tr\u003e\";\n    return;\n  }\n\n  let index = 1; // For the # column (serial number)\n  for (const uid in requests) {\n    const req = requests[uid];\n    const row = document.createElement(\"tr\");\n    row.classList.add(\"clickable-row\"); // Add class for styling/click handling\n    row.innerHTML = `\n      \u003ctd\u003e${index}\u003c/td\u003e\n      \u003ctd\u003e${req.fullName}\u003c/td\u003e\n      \u003ctd\u003e${req.email}\u003c/td\u003e\n      \u003ctd\u003e${new Date(req.submittedAt).toLocaleString()}\u003c/td\u003e\n      \u003ctd\u003e${req.status || \"Pending\"}\u003c/td\u003e\n      \u003ctd\u003e\n        \u003cbutton onclick=\"openApproveModal('${uid}')\"\u003eApprove\u003c/button\u003e\n        \u003cbutton onclick=\"deleteRequest('${uid}')\"\u003eDelete\u003c/button\u003e\n      \u003c/td\u003e\n    `;\n    // Add click handler for expansion\n    row.addEventListener(\"click\", () =\u003e toggleRowExpansion(row, req));\n    tbody.appendChild(row);\n\n    // Hidden expanded row (initially hidden)\n    const expandedRow = document.createElement(\"tr\");\n    expandedRow.classList.add(\"expanded-row\");\n    expandedRow.style.display = \"none\";\n    expandedRow.innerHTML = `\n      \u003ctd colspan=\"6\"\u003e\n        \u003cdiv class=\"expanded-content\"\u003e\n          \u003cp\u003e\u003cstrong\u003eFull Name:\u003c/strong\u003e ${req.fullName}\u003c/p\u003e\n          \u003cp\u003e\u003cstrong\u003eEmail:\u003c/strong\u003e ${req.email}\u003c/p\u003e\n          \u003cp\u003e\u003cstrong\u003eSubmitted At:\u003c/strong\u003e ${new Date(req.submittedAt).toLocaleString()}\u003c/p\u003e\n          \u003cp\u003e\u003cstrong\u003eStatus:\u003c/strong\u003e ${req.status || \"Pending\"}\u003c/p\u003e\n          \u003cp\u003e\u003cstrong\u003eUID:\u003c/strong\u003e ${req.uid}\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/td\u003e\n    `;\n    tbody.appendChild(expandedRow);\n\n    index++;\n  }\n});\n\n// 🔹 Toggle row expansion\nfunction toggleRowExpansion(row, req) {\n  const nextRow = row.nextElementSibling;\n  if (nextRow \u0026\u0026 nextRow.classList.contains(\"expanded-row\")) {\n    nextRow.style.display = nextRow.style.display === \"none\" ? \"table-row\" : \"none\";\n  }\n}\n\n// 🔹 Delete request and mark as rejected\nfunction deleteRequest(uid) {\n  if (confirm(\"Are you sure you want to delete this request? It will be marked as Rejected.\")) {\n    firebase.database().ref(`usersRequestingFunds/${uid}`).update({ status: \"Rejected\" })\n      .then(() =\u003e {\n        alert(\"Request marked as Rejected.\");\n      })\n      .catch(err =\u003e {\n        console.error(\"Error deleting request:\", err);\n        alert(\"Failed to delete request.\");\n      });\n  }\n}\n\n// 🔹 Open the approval modal and set the current UID, then auto-fill form fields\nfunction openApproveModal(uid) {\n  currentRequestUid = uid;\n  document.getElementById(\"approveModal\").style.display = \"block\";\n  document.getElementById(\"approveForm\").reset(); // Reset form first\n\n  // Fetch the request data to auto-fill fields\n  firebase.database().ref(`usersRequestingFunds/${uid}`).once(\"value\")\n    .then(snapshot =\u003e {\n      const req = snapshot.val();\n      if (req) {\n        // Auto-fill from the requesting user's data\n        document.getElementById(\"email\").value = req.email || \"\"; // Email from request\n        document.getElementById(\"username\").value = req.fullName || \"\"; // Username as fullName (default)\n        // Note: Password cannot be auto-filled as it's not stored/retrievable from Firebase Auth or the request.\n        // Leave it blank for admin to set manually.\n      }\n    })\n    .catch(err =\u003e {\n      console.error(\"Error fetching request data:\", err);\n    });\n}\n\n// 🔹 Close the modal\nfunction closeModal() {\n  document.getElementById(\"approveModal\").style.display = \"none\";\n  currentRequestUid = null;\n  currentUid2 = null;\n}\n\n// 🔹 Handle form submission for approval\ndocument.getElementById(\"approveForm\").addEventListener(\"submit\", async function(e) {\n  e.preventDefault();\n\n  if (!currentRequestUid) {\n    alert(\"No request selected.\");\n    return;\n  }\n\n  // Collect form data\n  const accountName = document.getElementById(\"accountName\").value.trim();\n  const username = document.getElementById(\"username\").value.trim();\n  const password = document.getElementById(\"password\").value;\n  const accountPassword = document.getElementById(\"accountPassword\").value;\n  const email = document.getElementById(\"email\").value.trim();\n  const balance = parseFloat(document.getElementById(\"balance\").value);\n  const softwareFee = document.getElementById(\"softwareFee\").value; // \"Paid\" or \"Unpaid\"\n\n  if (isNaN(balance)) {\n    alert(\"Balance must be a valid number.\");\n    return;\n  }\n\n  if (!softwareFee) {\n    alert(\"Please select Paid or Unpaid for Software Fee.\");\n    return;\n  }\n\n  try {\n    // Generate a unique uid2 (push key for the trading account)\n    const uid2 = firebase.database().ref(\"users\").push().key;\n\n    // Prepare the account data to store under /users/{uid2}\n    const accountData = {\n      name: accountName,          // Account name (e.g., \"ForexSecretWorld\")\n      accountNumber: username,    // Username (displayed as account number)\n      password: password,         // Account password (shown in table)\n      accountPassword: accountPassword, // Additional password field\n      email: email,\n      balance: balance,\n      appFee: softwareFee         // Software fee (\"Paid\" or \"Unpaid\")\n    };\n\n    // Step 1: Set /userInfo/{currentRequestUid}/uid2 = uid2 (nested under user login details)\n    await firebase.database().ref(`userInfo/${currentRequestUid}/uid2`).set(uid2);\n\n    // Step 2: Set /users/{uid2} = accountData (overwrites any existing data for this uid2)\n    await firebase.database().ref(`users/${uid2}`).set(accountData);\n\n    // Step 3: Remove the request from /usersRequestingFunds (cleanup)\n    await firebase.database().ref(`usersRequestingFunds/${currentRequestUid}`).remove();\n\n    alert(\"Request approved successfully! The user's trading account has been set up.\");\n    closeModal(); // Close modal after success\n\n    // Refresh the trading accounts table\n    loadTradingAccounts();\n\n  } catch (err) {\n    console.error(\"Error approving request:\", err);\n    alert(\"Failed to approve request. Please try again.\");\n  }\n});\n\n \ninput, select, textarea, button { padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; width: 100%; }\ntextarea { resize: vertical; }\nbutton { background: #ff523b; color: white; border: none; cursor: pointer; transition: 0.3s; }\nbutton:hover { background: #563434; }\ntable { width: 100%; border-collapse: collapse; margin-top: 20px; }\nth, td { padding: 10px; border-bottom: 1px solid #ccc; text-align: left; }\nth { background: #ff523b; color: white; }\n.product-image { width: 80px; height: 80px; object-fit: cover; border-radius: 5px; }\n.tabs { display: flex; margin-bottom: 20px; }\n.tab { padding: 10px 20px; cursor: pointer; border: 1px solid #ff523b; border-bottom: none; background: #fff; margin-right: 5px; border-top-left-radius: 5px; border-top-right-radius: 5px; }\n.tab.active { background: #ff523b; color: #fff; }\n.tab-content { display: none; background: #fff; padding: 20px; border: 1px solid #ff523b; border-radius: 5px; width:auto; }\n.tab-content.active { display: block; }\n.toast { position: fixed; top: 20px; right: 20px; background: #ff523b; color: white; padding: 10px 20px; border-radius: 5px; display: none; z-index: 9999; }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n\u003cdiv class=\"header\"\u003e\n  \u003ch2\u003eAdmin Panel\u003c/h2\u003e\n\u003c/div\u003e\n\n\u003cdiv class=\"container\"\u003e\n\n  \u003c!-- Tabs --\u003e\n  \u003cdiv class=\"tabs\"\u003e\n    \u003cdiv class=\"tab active\" onclick=\"openTab('productsTab')\"\u003eExisting Products\u003c/div\u003e\n    \u003cdiv class=\"tab\" onclick=\"openTab('pendingTab')\"\u003ePending Orders\u003c/div\u003e\n    \u003cdiv class=\"tab\" onclick=\"openTab('RequestFunds')\"\u003eRequest\u003c/div\u003e\n    \u003cdiv class=\"tab\" onclick=\"openTab('tradingTab')\"\u003eTrading Accounts\u003c/div\u003e\n    \u003cdiv class=\"tab\" onclick=\"openTab('userPasswordsTab')\"\u003eUser Passwords\u003c/div\u003e  \u003c!-- New tab for user passwords --\u003e\n  \u003c/div\u003e\n\n  \u003c!-- Existing Products Tab --\u003e\n  \u003cdiv id=\"productsTab\" class=\"tab-content active\"\u003e\n    \u003ch3\u003eAdd / Update Product\u003c/h3\u003e\n    \u003cinput type=\"hidden\" id=\"productId\"\u003e\n    \u003cinput type=\"text\" id=\"productName\" placeholder=\"Product Name\"\u003e\n    \u003ctextarea id=\"productDesc\" placeholder=\"Product Description\"\u003e\u003c/textarea\u003e\n    \u003cinput type=\"number\" id=\"productPrice\" placeholder=\"Price in USD\"\u003e\n    \u003cinput type=\"file\" id=\"productImageFile\"\u003e\n    \u003cselect id=\"productCategory\"\u003e\n      \u003coption value=\"\"\u003eSelect Category\u003c/option\u003e\n      \u003coption value=\"books\"\u003eBooks\u003c/option\u003e\n      \u003coption value=\"indicators\"\u003eIndicators\u003c/option\u003e\n      \u003coption value=\"robots\"\u003eRobots\u003c/option\u003e\n      \u003coption value=\"combos\"\u003eCombos\u003c/option\u003e\n    \u003c/select\u003e\n    \u003cbutton onclick=\"addOrUpdateProduct()\"\u003eAdd / Update Product\u003c/button\u003e\n\n    \u003ch3\u003eExisting Products\u003c/h3\u003e\n    \u003ctable id=\"productsTable\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\n          \u003cth\u003eImage\u003c/th\u003e\n          \u003cth\u003eName\u003c/th\u003e\n          \u003cth\u003eCategory\u003c/th\u003e\n          \u003cth\u003ePrice\u003c/th\u003e\n          \u003cth\u003eActions\u003c/th\u003e\n        \u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n\n  \u003c!-- Pending Orders Tab --\u003e\n  \u003cdiv id=\"pendingTab\" class=\"tab-content\"\u003e\n    \u003ch3\u003ePending Orders\u003c/h3\u003e\n    \u003ctable id=\"ordersTable\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\n          \u003cth\u003eOrder ID\u003c/th\u003e\n          \u003cth\u003eCustomer\u003c/th\u003e\n          \u003cth\u003eProduct\u003c/th\u003e\n          \u003cth\u003ePrice\u003c/th\u003e\n          \u003cth\u003eStatus\u003c/th\u003e\n          \u003cth\u003eAction\u003c/th\u003e\n        \u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n\n  \u003c!-- RequestFunds Tab --\u003e\n  \u003cdiv id=\"RequestFunds\" class=\"tab-content\"\u003e\n    \u003ch3\u003ePending\u003c/h3\u003e\n    \u003ctable id=\"propfirm\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\n          \u003cth\u003e#\u003c/th\u003e\n          \u003cth\u003eUser\u003c/th\u003e\n          \u003cth\u003eEmail\u003c/th\u003e\n          \u003cth\u003eSubmitted\u003c/th\u003e\n          \u003cth\u003eStatus\u003c/th\u003e\n          \u003cth\u003eAction\u003c/th\u003e\n        \u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n\n  \u003c!-- Trading Accounts Tab --\u003e\n  \u003cdiv id=\"tradingTab\" class=\"tab-content\"\u003e\n    \u003ch3\u003eTrading Accounts\u003c/h3\u003e\n    \u003ctable id=\"tradingAccounts\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\n          \u003cth\u003e#\u003c/th\u003e\n          \u003cth\u003eAccount Name\u003c/th\u003e\n          \u003cth\u003eAccount Number\u003c/th\u003e\n          \u003cth\u003eBalance\u003c/th\u003e\n          \u003cth\u003eSoftware Fee\u003c/th\u003e\n          \u003cth\u003eEmail\u003c/th\u003e\n          \u003cth\u003ePassword\u003c/th\u003e\n          \u003cth\u003eAccount Password\u003c/th\u003e\n          \u003cth\u003eAction\u003c/th\u003e\n        \u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n\n  \u003c!-- New User Passwords Tab --\u003e\n  \u003cdiv id=\"userPasswordsTab\" class=\"tab-content\"\u003e\n    \u003ch3\u003eUser Passwords\u003c/h3\u003e\n    \u003ctable id=\"userPasswordsTable\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\n          \u003cth\u003eName\u003c/th\u003e\n          \u003cth\u003eEmail\u003c/th\u003e\n          \u003cth\u003ePassword\u003c/th\u003e\n          \u003cth\u003eAccount Password\u003c/th\u003e\n        \u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n\n\u003c/div\u003e\n\n\u003cdiv class=\"toast\" id=\"toast\"\u003e\u003c/div\u003e\n\n  \u003c!-- Modal for approval form --\u003e\n  \u003cdiv id=\"approveModal\" style=\"display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);\"\u003e\n    \u003cdiv style=\"position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px;\"\u003e\n      \u003ch2\u003eApprove Request\u003c/h2\u003e\n      \u003cform id=\"approveForm\"\u003e\n        \u003clabel\u003eAccount Name: \u003cinput id=\"accountName\" required\u003e\u003c/label\u003e\u003cbr\u003e\n        \u003clabel\u003eUsername: \u003cinput id=\"username\" required\u003e\u003c/label\u003e\u003cbr\u003e\n        \u003clabel\u003ePassword: \u003cinput id=\"password\" type=\"password\" required\u003e\u003c/label\u003e\u003cbr\u003e\n        \u003clabel\u003eAccount Password: \u003cinput id=\"accountPassword\" type=\"password\" required\u003e\u003c/label\u003e\u003cbr\u003e\n        \u003clabel\u003eEmail: \u003cinput id=\"email\" type=\"email\" required\u003e\u003c/label\u003e\u003cbr\u003e\n        \u003clabel\u003eBalance: \u003cinput id=\"balance\" type=\"number\" step=\"0.01\" required\u003e\u003c/label\u003e\u003cbr\u003e\n        \u003clabel\u003eSoftware Fee: \n          \u003cselect id=\"softwareFee\" required\u003e\n            \u003coption value=\"\"\u003eSelect\u003c/option\u003e\n            \u003coption value=\"Paid\"\u003ePaid\u003c/option\u003e\n            \u003coption value=\"Unpaid\"\u003eUnpaid\u003c/option\u003e\n          \u003c/select\u003e\n        \u003c/label\u003e\u003cbr\u003e\n        \u003cbutton type=\"submit\"\u003eApprove\u003c/button\u003e\n        \u003cbutton type=\"button\" onclick=\"closeModal()\"\u003eCancel\u003c/button\u003e\n      \u003c/form\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\n\u003c!-- Edit Modal for Trading Accounts --\u003e\n\u003cdiv id=\"editModal\" style=\"display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);\"\u003e\n  \u003cdiv style=\"position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px;\"\u003e\n    \u003ch2\u003eEdit Trading Account\u003c/h2\u003e\n    \u003cform id=\"editForm\"\u003e\n      \u003clabel\u003eAccount Name: \u003cinput id=\"editAccountName\" required\u003e\u003c/label\u003e\u003cbr\u003e\n      \u003clabel\u003eAccount Password: \u003cinput id=\"editAccountPassword\" type=\"password\" required\u003e\u003c/label\u003e\u003cbr\u003e\n      \u003clabel\u003eBalance: \u003cinput id=\"editBalance\" type=\"number\" step=\"0.01\" required\u003e\u003c/label\u003e\u003cbr\u003e\n      \u003clabel\u003eSoftware Fee: \n        \u003cselect id=\"editSoftwareFee\" required\u003e\n          \u003coption value=\"\"\u003eSelect\u003c/option\u003e\n          \u003coption value=\"Paid\"\u003ePaid\u003c/option\u003e\n          \u003coption value=\"Unpaid\"\u003eUnpaid\u003c/option\u003e\n        \u003c/select\u003e\n      \u003c/label\u003e\u003cbr\u003e\n      \u003cbutton type=\"submit\"\u003eUpdate\u003c/button\u003e\n      \u003cbutton type=\"button\" onclick=\"closeModal()\"\u003eCancel\u003c/button\u003e\n    \u003c/form\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\n\u003cscript\u003e\n \n// Global variable to track the current request UID being approved or edited\nlet currentRequestUid = null;\nlet currentUid2 = null; // For editing trading accounts\n\n// 🔹 Load and display pending requests in the table on page load\nfirebase.database().ref(\"usersRequestingFunds\").on(\"value\", snapshot =\u003e {\n  const requests = snapshot.val();\n  const tbody = document.querySelector(\"#propfirm tbody\");\n  tbody.innerHTML = \"\"; // Clear previous rows\n\n  if (!requests) {\n    // No requests: Add a single row spanning all columns\n    tbody.innerHTML = \"\u003ctr\u003e\u003ctd colspan='6'\u003eNo pending requests.\u003c/td\u003e\u003c/tr\u003e\";\n    return;\n  }\n\n  let index = 1; // For the # column (serial number)\n  for (const uid in requests) {\n    const req = requests[uid];\n    const row = document.createElement(\"tr\");\n    row.classList.add(\"clickable-row\"); // Add class for styling/click handling\n    row.innerHTML = `\n      \u003ctd\u003e${index}\u003c/td\u003e\n      \u003ctd\u003e${req.fullName}\u003c/td\u003e\n      \u003ctd\u003e${req.email}\u003c/td\u003e\n      \u003ctd\u003e${new Date(req.submittedAt).toLocaleString()}\u003c/td\u003e\n      \u003ctd\u003e${req.status || \"Pending\"}\u003c/td\u003e\n      \u003ctd\u003e\n        \u003cbutton onclick=\"openApproveModal('${uid}')\"\u003eApprove\u003c/button\u003e\n        \u003cbutton onclick=\"deleteRequest('${uid}')\"\u003eDelete\u003c/button\u003e\n      \u003c/td\u003e\n    `;\n    // Add click handler for expansion\n    row.addEventListener(\"click\", () =\u003e toggleRowExpansion(row, req));\n    tbody.appendChild(row);\n\n    // Hidden expanded row (initially hidden)\n    const expandedRow = document.createElement(\"tr\");\n    expandedRow.classList.add(\"expanded-row\");\n    expandedRow.style.display = \"none\";\n    expandedRow.innerHTML = `\n      \u003ctd colspan=\"6\"\u003e\n        \u003cdiv class=\"expanded-content\"\u003e\n          \u003cp\u003e\u003cstrong\u003eFull Name:\u003c/strong\u003e ${req.fullName}\u003c/p\u003e\n          \u003cp\u003e\u003cstrong\u003eEmail:\u003c/strong\u003e ${req.email}\u003c/p\u003e\n          \u003cp\u003e\u003cstrong\u003eSubmitted At:\u003c/strong\u003e ${new Date(req.submittedAt).toLocaleString()}\u003c/p\u003e\n          \u003cp\u003e\u003cstrong\u003eStatus:\u003c/strong\u003e ${req.status || \"Pending\"}\u003c/p\u003e\n          \u003cp\u003e\u003cstrong\u003eUID:\u003c/strong\u003e ${req.uid}\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/td\u003e\n    `;\n    tbody.appendChild(expandedRow);\n\n    index++;\n  }\n});\n\n// 🔹 Toggle row expansion\nfunction toggleRowExpansion(row, req) {\n  const nextRow = row.nextElementSibling;\n  if (nextRow \u0026\u0026 nextRow.classList.contains(\"expanded-row\")) {\n    nextRow.style.display = nextRow.style.display === \"none\" ? \"table-row\" : \"none\";\n  }\n}\n\n// 🔹 Delete request and mark as rejected\nfunction deleteRequest(uid) {\n  if (confirm(\"Are you sure you want to delete this request? It will be marked as Rejected.\")) {\n    firebase.database().ref(`usersRequestingFunds/${uid}`).update({ status: \"Rejected\" })\n      .then(() =\u003e {\n        alert(\"Request marked as Rejected.\");\n      })\n      .catch(err =\u003e {\n        console.error(\"Error deleting request:\", err);\n        alert(\"Failed to delete request.\");\n      });\n  }\n}\n\n// 🔹 Open the approval modal and set the current UID, then auto-fill form fields\nfunction openApproveModal(uid) {\n  currentRequestUid = uid;\n  document.getElementById(\"approveModal\").style.display = \"block\";\n  document.getElementById(\"approveForm\").reset(); // Reset form first\n\n  // Fetch the request data to auto-fill fields\n  firebase.database().ref(`usersRequestingFunds/${uid}`).once(\"value\")\n    .then(snapshot =\u003e {\n      const req = snapshot.val();\n      if (req) {\n        // Auto-fill from the requesting user's data\n        document.getElementById(\"email\").value = req.email || \"\";\n        document.getElementById(\"password\").value = req.password || \"\";\n         // Email from request\n        document.getElementById(\"username\").value = req.fullName || \"\"; // Username as fullName (default)\n id2];\n      const row = document.createElement(\"tr\");\n      row.innerHTML = `\n        \u003ctd\u003e${index}\u003c/td\u003e\n        \u003ctd\u003e${user.name || \"\"}\u003c/td\u003e\n        \u003ctd\u003e${user.accountNumber || \"\"}\u003c/td\u003e\n        \u003ctd\u003e$${Number(user.balance).toFixed(2)}\u003c/td\u003e\n        \u003ctd\u003e${user.appFee || \"\"}\u003c/td\u003e\n        \u003ctd\u003e${user.email || \"\"}\u003c/td\u003e\n        \u003ctd\u003e\n          \u003cinput type=\"password\" value=\"${user.password || \"\"}\" id=\"password-${uid2}\" readonly\u003e\n          \u003cbutton onclick=\"togglePassword('password-${uid2}')\" style=\"border:none; background:none; cursor:pointer;\"\u003e\n            👁️\n          \u003c/button\u003e\n        \u003c/td\u003e\n        \u003ctd\u003e\n          \u003cinput type=\"password\" value=\"${user.accountPassword || \"\"}\" id=\"accountPassword-${uid2}\" readonly\u003e\n          \u003cbutton onclick=\"togglePassword('accountPassword-${uid2}')\" style=\"border:none; background:none; cursor:pointer;\"\u003e\n            👁️\n          \u003c/button\u003e\n        \u003c/td\u003e\n        \u003ctd\u003e\n          \u003cbutton onclick=\"openEditModal('${uid2}')\"\u003eEdit\u003c/button\u003e\n          \u003cbutton onclick=\"deleteTradingAccount('${uid2}')\"\u003eDelete\u003c/button\u003e\n        \u003c/td\u003e\n      `;\n      tradingTbody.appendChild(row);\n      index++;\n    }\n  });\n}\n\n// 🔹 Load and display user passwords in the table (simplified view)\nfunction loadUserPasswords() {\n  const passwordsTbody = document.querySelector(\"#userPasswordsTable tbody\");\n  if (!passwordsTbody) return; // If the table doesn't exist, skip\n\n  firebase.database().ref(\"users\").on(\"value\", snapshot =\u003e {\n    const users = snapshot.val();\n    passwordsTbody.innerHTML = \"\"; // Clear previous rows\n\n    if (!users) {\n      passwordsTbody.innerHTML = \"\u003ctr\u003e\u003ctd colspan='4'\u003eNo
