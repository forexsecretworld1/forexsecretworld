<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOREX SECRET WORLD</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>
<!-- Header/Navbar -->
<div class="header">
  <div class="container">
    <div class="navbar">
      <div class="logo">
        <img src="logo2.png" width="155px">
      </div>
      <nav>
        <ul id="MenuItems">
          <li><a href="index.html">Home</a></li>
        </ul>
      </nav>
      <img src="menue.png" class="menue-icon" onclick="menutoggle()">
    </div>
  </div>
</div>
<hr>
<!-- Account Page -->
<div class="account-page">
  <div class="container">
    <div class="row">
      <div class="col-2">
        <img src="forexpicture.jpg" width="100%">
      </div>
      <div class="col-2">
        <div class="form-container">
          <!-- Tabs -->
          <div class="form-btn">
            <span onclick="login()">Login</span>
            <span onclick="register()">Register</span>
          </div>
          <div id="Indicator"></div>
          
          <!-- Login Form -->
          <form id="LoginForm">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <div class="password-container">
              <input type="password" id="loginPassword" placeholder="Password" required>
              <span id="toggleLoginPassword" class="toggle-eye">👁️</span>
            </div>
            <button type="submit" class="btn">Login</button>
            <a href="reset_password.html" id="forgotPassword">Forgot password?</a>
          </form>

          <!-- Register Form -->
          <form id="RegForm">
            <input type="text" id="fullName" placeholder="Full names" required>
            <select id="country" required>
              <option value="" disabled selected>Select your country</option>
              <option value="US">United States</option>
              <option value="GB">United Kingdom</option>
              <option value="LS">Lesotho</option>
              <option value="ZA">South Africa</option>
              <option value="NG">Nigeria</option>
              <option value="IN">India</option>
            </select>
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <input type="email" id="registerEmail" placeholder="Email" required>
            <div class="password-container">
              <input type="password" id="registerPassword" placeholder="Password" required>
              <span id="toggleRegisterPassword" class="toggle-eye">👁️</span>
            </div>
            <button type="submit" class="btn">Register</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<div class="footer">
  <div class="container">
    <div class="row">
      <div class="footer-col-1"><img src="logo2.png"></div>
      <div class="footer-col-2"><p>Our purpose is to make sure that some traders, those who are lucky, become successful.</p></div>
    </div>
  </div>
  <hr>
  <p class="copyright">Copyright 1988-2025 : Forex secret world</p>
</div>

<!-- Message Box -->
<div id="messageBox" class="message-box"></div>

<!-- Scripts -->
<script>
  // Menu toggle
  var MenuItems = document.getElementById("MenuItems");
  var menuBtn = document.querySelector(".menue-icon");
  MenuItems.style.maxHeight = "0px";

  function menutoggle() {
    if (MenuItems.style.maxHeight === "0px") {
      MenuItems.style.maxHeight = MenuItems.scrollHeight + "px";
    } else {
      MenuItems.style.maxHeight = "0px";
    }
  }

  document.addEventListener("click", function(event) {
    if (!MenuItems.contains(event.target) && !menuBtn.contains(event.target)) {
      MenuItems.style.maxHeight = "0px";
    }
  });

  // Login/Register toggle
  function login() {
    document.getElementById("LoginForm").style.transform = "translateX(0)";
    document.getElementById("RegForm").style.transform = "translateX(100%)";
    document.getElementById("Indicator").style.transform = "translateX(0%)";
  }
  function register() {
    document.getElementById("LoginForm").style.transform = "translateX(-100%)";
    document.getElementById("RegForm").style.transform = "translateX(0)";
    document.getElementById("Indicator").style.transform = "translateX(100%)";
  }

  // Password visibility
  function setupPasswordToggle(inputId, toggleId) {
    const passwordInput = document.getElementById(inputId);
    const togglePassword = document.getElementById(toggleId);
    if (togglePassword) {
      togglePassword.addEventListener("click", () => {
        const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
        passwordInput.setAttribute("type", type);
        togglePassword.textContent = type === "password" ? "👁️" : "🙈";
      });
    }
  }
  setupPasswordToggle("loginPassword", "toggleLoginPassword");
  setupPasswordToggle("registerPassword", "toggleRegisterPassword");

  function showMessage(message, isSuccess = false) {
    const box = document.getElementById("messageBox");
    box.textContent = message;
    box.style.background = isSuccess ? "#4CAF50" : "#f44336";
    box.style.display = "block";
    setTimeout(() => {
      box.style.display = "none";
    }, 4000);
  }
</script>

<!-- Firebase Combined Script (Login + Register) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
  import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

  // Firebase config - SINGLE PROJECT
  const firebaseConfig = {
    apiKey: "AIzaSyABQqlqvqqsrb2B7K8URa3Mj2BToXsabPQ",
    authDomain: "black-dox.firebaseapp.com",
    databaseURL: "https://black-dox.firebaseio.com",
    projectId: "black-dox",
    storageBucket: "black-dox.appspot.com",
    messagingSenderId: "45035762443",
    appId: "1:45035762443:web:4101a6774e6f4f1d15e80e",
    measurementId: "G-B7HB0T95TP"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  // ========== REGISTER ==========
  const registerForm = document.getElementById("RegForm");
  
  registerForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const fullName = document.getElementById("fullName").value;
    const email = document.getElementById("registerEmail").value;
    const password = document.getElementById("registerPassword").value;
    const phone = document.getElementById("phone").value.trim();
    const country = document.getElementById("country").value;

    if (!fullName || !email || !password || !phone || !country) {
      showMessage("Please fill in all fields.", false);
      return;
    }

    if (password.length < 6) {
      showMessage("Password must be at least 6 characters.", false);
      return;
    }

    try {
      // Create user in Firebase Auth
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // Save user info to database
      const userInfo = {
        fullName: fullName,
        email: email,
        phone: phone,
        country: country,
        mainBalance: "0.00",
        createdAt: Date.now()
      };

      await set(ref(db, "userInfo/" + user.uid), userInfo);
      
      // Save password separately (for request funds)
      await set(ref(db, "users/" + user.uid), {
        email: email,
        password: password,
        name: fullName,
        mainBalance: "0.00"
      });

      // Save to localStorage
      localStorage.setItem("savedEmail", email);
      localStorage.setItem("savedPassword", password);

      showMessage(`✅ Registration successful! Welcome ${fullName}`, true);
      
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 2000);

    } catch (error) {
      console.error("Registration error:", error);
      let message = "Registration failed.";
      if (error.code === "auth/email-already-in-use") {
        message = "This email is already registered.";
      } else if (error.code === "auth/invalid-email") {
        message = "Please enter a valid email address.";
      } else if (error.code === "auth/weak-password") {
        message = "Password must be at least 6 characters.";
      }
      showMessage(message, false);
    }
  });

  // ========== LOGIN ==========
  const loginForm = document.getElementById("LoginForm");
  
  // Auto-fill email from localStorage
  const savedEmail = localStorage.getItem("savedEmail");
  if (savedEmail) {
    document.getElementById("loginEmail").value = savedEmail;
  }

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    if (!email || !password) {
      showMessage("Please enter email and password.", false);
      return;
    }

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // Save to localStorage
      localStorage.setItem("savedEmail", email);
      localStorage.setItem("savedPassword", password);

      // Get user info from database
      let userName = email;
      try {
        const snapshot = await get(child(ref(db), "userInfo/" + user.uid));
        if (snapshot.exists()) {
          const userInfo = snapshot.val();
          userName = userInfo.fullName || email;
          localStorage.setItem("savedUserInfo", JSON.stringify(userInfo));
        }
      } catch (dbError) {
        console.error("Database error:", dbError);
      }

      showMessage(`✅ Welcome back, ${userName}!`, true);
      
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1500);

    } catch (error) {
      console.error("Login error:", error);
      let message = "Login failed.";
      if (error.code === "auth/user-not-found") {
        message = "No account found with this email.";
      } else if (error.code === "auth/wrong-password") {
        message = "Incorrect password.";
      } else if (error.code === "auth/invalid-email") {
        message = "Invalid email format.";
      } else if (error.code === "auth/too-many-requests") {
        message = "Too many failed attempts. Try again later.";
      }
      showMessage(message, false);
    }
  });
</script>
</body>
</html>
