<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forex Secret World - Funds Status</title>
  <link rel="stylesheet" href="style.css">
 <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <script src="firebase.js"></script>
</head>
<body>

  <!-- Original Header -->
  <div class="header">
    <div class="container">
      <div class="navbar">
        <div class="logo">
          <img src="logo2.png" width="155px">
        </div>
        <nav>
          <ul id="MenuItems">
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard.html">Client dashboard</a></li>
          </ul>
        </nav>
        <img src="menue.png" class="menue-icon" onclick="menutoggle()">
      </div>
    </div>
  </div>

  <!-- Status Card -->
  <div class="signup-container">
    <h2>Trading Funds Status</h2>
    <div id="statusContainer">
      <p>Loading your request status...</p>
    </div>
  </div>

  <!-- Original Footer -->
  <div class="footer">
    <div class="container">
      <div class="row">
        <div class="footer-col-1">
          <img src="logo2.png">
        </div>
        <div class="footer-col-2">
          <p>Our purpose is to make sure that some traders, those who are lucky become successful.</p>
        </div>
      </div>
    </div>
    <hr>
    <p class="copyright">Copyright 1988-2025 : Forex secret world</p>
  </div>

  <!-- JS -->
  <script>
    var MenuItems = document.getElementById("MenuItems");
    var menuBtn = document.querySelector(".menue-icon");

    MenuItems.style.maxHeight = "0px";

    function menutoggle() {
      if (MenuItems.style.maxHeight === "0px") {
        MenuItems.style.maxHeight = MenuItems.scrollHeight + "px";
      } else {
        MenuItems.style.maxHeight = "0px";
      }
    }

    document.addEventListener("click", function(event) {
      if (!MenuItems.contains(event.target) && !menuBtn.contains(event.target)) {
        MenuItems.style.maxHeight = "0px";
      }
    });
  </script>

  <script>
const statusContainer = document.getElementById("statusContainer");

firebase.auth().onAuthStateChanged(function(user) {
  if (!user) {
    statusContainer.innerHTML = "<p>Please log in to see your request status.</p>";
    window.location.href = "login.html";
    return;
  }

  // Check if user has an active trading account (uid2 exists)
  firebase.database().ref('userInfo/' + user.uid + '/uid2').once('value')
    .then(uid2Snapshot => {
      const uid2 = uid2Snapshot.val();
      let hasActiveAccount = false;
      
      if (uid2) {
        return firebase.database().ref('users/' + uid2).once('value')
          .then(tradingAccountSnapshot => {
            hasActiveAccount = tradingAccountSnapshot.exists();
            return hasActiveAccount;
          });
      }
      return false;
    })
    .then(hasActiveAccount => {
      // Check for pending requests
      return firebase.database().ref("usersRequestingFunds").orderByChild("uid").equalTo(user.uid).once("value")
        .then(requestsSnapshot => {
          let hasPendingRequest = false;
          let latestRequest = null;
          
          if (requestsSnapshot.exists()) {
            const requests = requestsSnapshot.val();
            
            // Find latest request
            for (const key in requests) {
              const request = requests[key];
              if (!latestRequest || request.submittedAt > latestRequest.submittedAt) {
                latestRequest = request;
              }
              
              // Check if any request is pending
              if (request.status === "Pending" || !request.status) {
                hasPendingRequest = true;
              }
            }
          }
          
          return { hasActiveAccount, hasPendingRequest, latestRequest };
        });
    })
    .then(({ hasActiveAccount, hasPendingRequest, latestRequest }) => {
      let html = `<h3>Trading Funds Status</h3>`;
      
      // Show status based on user's situation
      if (hasActiveAccount) {
        // User has active trading account (approved request)
        html += `
          <div style="background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <h4 style="margin-top: 0;">✅ Active Trading Account</h4>
            <p>Your trading funds request has been <strong>approved</strong> and your account is active.</p>
            <p>Go to <a href="phases.html" style="color: #155724; font-weight: bold;">Phases</a> to start trading.</p>
          </div>
        `;
        
        // Don't show request button when account is active
        html += `
          <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 20px;">
            <p><strong>Note:</strong> You cannot request new funds while you have an active trading account.</p>
            <p>Complete your phases to request new funds.</p>
          </div>
        `;
        
      } else if (hasPendingRequest && latestRequest) {
        // User has pending request
        const status = latestRequest.status || "Pending";
        const submittedDate = new Date(latestRequest.submittedAt).toLocaleString();
        
        html += `
          <div style="background: #fff3cd; color: #856404; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <h4 style="margin-top: 0;">⏳ Request ${status}</h4>
            <p>Your trading funds request is <strong>${status.toLowerCase()}</strong>.</p>
            <p><strong>Submitted:</strong> ${submittedDate}</p>
            <p>Please wait for admin approval. This usually takes 24-48 hours.</p>
          </div>
        `;
        
      } else {
        // No active account and no pending request
        html += `
          <div style="background: #d1ecf1; color: #0c5460; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <h4 style="margin-top: 0;">📋 No Active Request</h4>
            <p>You don't have any pending trading funds requests.</p>
            <p>You can request trading funds to start your journey.</p>
          </div>
          
          <div style="text-align: center; margin-top: 30px;">
            <a href="request_funds.html" class="btn" style="display: inline-block; background: #ff523b; color: white; padding: 12px 30px; border-radius: 5px; text-decoration: none; font-size: 16px; font-weight: bold;">
              Request Trading Funds
            </a>
          </div>
        `;
      }
      
      // Show completed requests history if any
      firebase.database().ref("usersRequestingFunds").orderByChild("uid").equalTo(user.uid).once("value")
        .then(historySnapshot => {
          if (historySnapshot.exists()) {
            const requests = historySnapshot.val();
            const completedRequests = [];
            
            for (const key in requests) {
              const request = requests[key];
              if (request.status === "Completed") {
                completedRequests.push(request);
              }
            }
            
            if (completedRequests.length > 0) {
              html += `<div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee;">`;
              html += `<h4>Previous Requests</h4>`;
              
              completedRequests.forEach((request, index) => {
                const completedDate = request.completedAt ? new Date(request.completedAt).toLocaleString() : "N/A";
                const payout = request.payoutAmount ? `$${parseFloat(request.payoutAmount).toFixed(2)}` : "N/A";
                
                html += `
                  <div style="background: #f8f9fa; padding: 10px; border-radius: 5px; margin-bottom: 10px;">
                    <p><strong>Request ${index + 1}:</strong> Completed on ${completedDate}</p>
                    <p>Payout: ${payout}</p>
                  </div>
                `;
              });
              
              html += `</div>`;
            }
          }
          
          statusContainer.innerHTML = html;
        });
    })
    .catch(function(err) {
      console.error("Error:", err);
      statusContainer.innerHTML = "<p>Could not fetch request status. Please try again later.</p>";
    });
});
</script>
</body>
</html>
