<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forex Secret World - Pay Software Fee</title>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <script src="firebase.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .payment-section {
      padding: 15px;
      margin: 20px;
      text-align: center;
    }
    
    .payment-section h2 {
      color: #ff523b;
      margin-bottom: 30px;
    }
    
    .payment-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 300px;
      margin: 0 auto;
    }
    
    .payment-btn {
      padding: 15px 30px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      font-family: 'Poppins', sans-serif;
    }
    
    .payWithMainBalance {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .payWithMainBalance:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .payWithPaypal {
      background: #ffc439;
      color: #111111;
      border: 1px solid #e0e0e0;
    }
    
    .payWithPaypal:hover {
      background: #f5b931;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 196, 57, 0.4);
    }
    
    #paypal-button-container {
      margin-top: 20px;
      max-width: 300px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

  <!-- Original Header -->
  <div class="header">
    <div class="container">
      <div class="navbar">
        <div class="logo">
          <img src="logo2.png" width="155px">
        </div>
        <nav>
          <ul id="MenuItems">
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard.html">Back</a></li>
          </ul>
        </nav>
        <img src="menue.png" class="menue-icon" onclick="menutoggle()">
      </div>
    </div>
  </div>

  <!-- Pay Section -->
  <section class="payment-section">
    <h2>Pay Software Fee - $46.00</h2>
    
    <!-- Payment Buttons -->
    <div class="payment-buttons" id="mainButtons">
      <button type="button" class="payment-btn payWithMainBalance" onclick="payWithMainBalance()">Pay with Main Balance</button>
      <button type="button" class="payment-btn payWithPaypal" onclick="showPayPalButton()">Debit/Credit Card or PayPal</button>
    </div>
    
    <!-- PayPal Button Container (hidden by default) -->
    <div id="paypal-button-container" style="display: none;"></div>
  </section>

  <!-- Message Box -->
  <div id="messageBox" style="position: fixed; top: 20px; right: 20px; padding: 15px 20px; border-radius: 5px; color: white; display: none; z-index: 9999;"></div>

  <!-- Original Footer -->
  <div class="footer">
    <div class="container">
      <div class="row">
        <div class="footer-col-1">
          <img src="logo2.png"> 
        </div>
        <div class="footer-col-2">
          <p>Our purpose is to make sure that some traders, those who are lucky become successful.</p> 
        </div>
      </div>
    </div>
    <hr>
    <p class="copyright">Copyright 1988-2025 : Forex secret world</p>
  </div>

  <!-- Menu Toggle JS -->
  <script>
    var MenuItems = document.getElementById("MenuItems");
    var menuBtn = document.querySelector(".menue-icon");

    MenuItems.style.maxHeight = "0px";

    function menutoggle() {
      if (MenuItems.style.maxHeight === "0px") {
        MenuItems.style.maxHeight = MenuItems.scrollHeight + "px";
      } else {
        MenuItems.style.maxHeight = "0px";
      }
    }

    document.addEventListener("click", function(event) {
      if (!MenuItems.contains(event.target) && !menuBtn.contains(event.target)) {
        MenuItems.style.maxHeight = "0px";
      }
    });

    function showMessage(message, isSuccess = true) {
      const box = document.getElementById("messageBox");
      box.style.background = isSuccess ? "#4CAF50" : "#f44336";
      box.textContent = message;
      box.style.display = "block";
      setTimeout(() => {
        box.style.display = "none";
      }, 4000);
    }
  </script>

  <!-- Load PayPal SDK with your client ID -->
  <script src="https://www.paypal.com/sdk/js?client-id=ATMbyWh7-xm6nqFl4Biy_WazK0Zacj7fnqTlVvHn5jx7mvOUcaBpqXxMHgcYM1D2nmk1Nva_SZXjtrpn&currency=USD"></script>

  <script>
    let currentUser = null;

    // Pay with Main Balance
    async function payWithMainBalance() {
      if (!currentUser) {
        showMessage("❌ Please log in first.", false);
        return;
      }

      const uid = currentUser.uid;
      
      try {
        // Get user's main balance
        const snapshot = await db.ref('users/' + uid).once('value');
        const userData = snapshot.val();
        const mainBalance = parseFloat(userData.mainBalance || 0);
        
        if (mainBalance >= 46) {
          // Deduct from main balance
          const newBalance = mainBalance - 46;
          await db.ref('users/' + uid).update({ 
            mainBalance: newBalance.toFixed(2),
            appFee: "Paid" 
          });
          
          showMessage("✅ Payment successful! Redirecting to phases...", true);
          
          // Redirect to phases after 2 seconds
          setTimeout(() => {
            window.location.href = "phases.html";
          }, 2000);
        } else {
          showMessage("❌ Insufficient main balance. Need $46.00", false);
        }
      } catch (error) {
        console.error("Error processing payment:", error);
        showMessage("❌ Error processing payment. Please try again.", false);
      }
    }

    // Show PayPal button (like in buy.html)
    function showPayPalButton() {
      if (!currentUser) {
        showMessage("❌ Please log in first.", false);
        return;
      }

      // Hide regular buttons, show PayPal container
      document.getElementById('mainButtons').style.display = 'none';
      document.getElementById('paypal-button-container').style.display = 'block';
      
      // Show info message (like your alert in the original)
      alert("ℹ️ Full access to FluxiTrade can take up to 24 hours after successful payment.");
      
      // Render PayPal button (same pattern as buy.html)
      if (typeof paypal !== 'undefined') {
        paypal.Buttons({
          style: { 
            color: 'gold', 
            shape: 'rect', 
            label: 'paypal', 
            height: 40 
          },

          createOrder: function(data, actions) {
            return actions.order.create({
              purchase_units: [{
                description: "FluxiTrade Software Access",
                amount: { 
                  currency_code: "USD", 
                  value: "46.00" 
                }
              }]
            });
          },

          onApprove: function(data, actions) {
            return actions.order.capture().then(async function(details) {
              console.log(`Payment successful! Thank you, ${details.payer.name.given_name}.`);
              
              // Update software fee status in Firebase
              await db.ref('users/' + currentUser.uid).update({ 
                appFee: "Paid" 
              });
              
              showMessage("✅ Payment successful! Redirecting to phases...", true);
              
              // Redirect to phases after 2 seconds
              setTimeout(() => {
                window.location.href = "phases.html";
              }, 2000);
            });
          },

          onCancel: function() {
            console.log("Payment cancelled.");
            // Show regular buttons again
            document.getElementById('mainButtons').style.display = 'flex';
            document.getElementById('paypal-button-container').style.display = 'none';
          },

          onError: function(err) {
            console.error('PayPal error:', err);
            showMessage("❌ Payment failed. Please try again.", false);
            // Show regular buttons again
            document.getElementById('mainButtons').style.display = 'flex';
            document.getElementById('paypal-button-container').style.display = 'none';
          }

        }).render('#paypal-button-container');
      } else {
        console.error('PayPal SDK not loaded');
        showMessage("❌ Payment system unavailable. Please try again later.", false);
      }
    }

    // Listen for auth state
    firebase.auth().onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;
    });
  </script>

</body>
</html>
