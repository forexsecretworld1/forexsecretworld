<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forex Secret World - Pay Software Fee</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <script src="firebase.js"></script>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .payment-section {
      padding: 15px;
      margin: 20px;
      text-align: center;
    }
    
    .payment-section h2 {
      color: #ff523b;
      margin-bottom: 30px;
    }
    
    .payment-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 300px;
      margin: 0 auto;
    }
    
    .payment-btn {
      padding: 15px 30px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      font-family: 'Poppins', sans-serif;
    }
    
    .payWithMainBalance {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .payWithMainBalance:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .payWithPaypal {
      background: #ffc439;
      color: #111111;
      border: 1px solid #e0e0e0;
    }
    
    .payWithPaypal:hover {
      background: #f5b931;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 196, 57, 0.4);
    }
  </style>
</head>
<body>

  <!-- Original Header -->
  <div class="header">
    <div class="container">
      <div class="navbar">
        <div class="logo">
          <img src="logo2.png" width="155px">
        </div>
        <nav>
          <ul id="MenuItems">
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard.html">Back</a></li>
          </ul>
        </nav>
        <img src="menue.png" class="menue-icon" onclick="menutoggle()">
      </div>
    </div>
  </div>

  <!-- Pay Buttons Section -->
  <section class="payment-section">
    <h2>Pay software fee</h2>
    <div class="payment-buttons">
      <button type="button" class="payment-btn payWithMainBalance" onclick="payWithMainBalance()">Pay with Main Balance</button>
      <button type="button" class="payment-btn payWithPaypal" onclick="payWithPaypal()">Debit/Credit Card or PayPal</button>
    </div>
  </section>

  <!-- Message Box -->
  <div id="messageBox" style="position: fixed; top: 20px; right: 20px; padding: 15px 20px; border-radius: 5px; color: white; display: none; z-index: 9999;"></div>

  <!-- Original Footer -->
  <div class="footer">
    <div class="container">
      <div class="row">
        <div class="footer-col-1">
          <img src="logo2.png"> 
        </div>
        <div class="footer-col-2">
          <p>Our purpose is to make sure that some traders, those who are lucky become successful.</p> 
        </div>
      </div>
    </div>
    <hr>
    <p class="copyright">Copyright 1988-2025 : Forex secret world</p>
  </div>

  <!-- Menu Toggle JS -->
  <script>
    var MenuItems = document.getElementById("MenuItems");
    var menuBtn = document.querySelector(".menue-icon");

    MenuItems.style.maxHeight = "0px";

    function menutoggle() {
      if (MenuItems.style.maxHeight === "0px") {
        MenuItems.style.maxHeight = MenuItems.scrollHeight + "px";
      } else {
        MenuItems.style.maxHeight = "0px";
      }
    }

    document.addEventListener("click", function(event) {
      if (!MenuItems.contains(event.target) && !menuBtn.contains(event.target)) {
        MenuItems.style.maxHeight = "0px";
      }
    });

    function showMessage(message, isSuccess = true) {
      const box = document.getElementById("messageBox");
      box.style.background = isSuccess ? "#4CAF50" : "#f44336";
      box.textContent = message;
      box.style.display = "block";
      setTimeout(() => {
        box.style.display = "none";
      }, 4000);
    }
  </script>

  <script>
    let currentUser = null;

    // Pay with Main Balance
    async function payWithMainBalance() {
      if (!currentUser) {
        showMessage("❌ Please log in first.", false);
        return;
      }

      const uid = currentUser.uid;
      
      try {
        // Get user's main balance
        const snapshot = await db.ref('users/' + uid).once('value');
        const userData = snapshot.val();
        const mainBalance = parseFloat(userData.mainBalance || 0);
        
        if (mainBalance >= 46) {
          // Deduct from main balance
          const newBalance = mainBalance - 46;
          await db.ref('users/' + uid).update({ 
            mainBalance: newBalance.toFixed(2),
            appFee: "Paid" 
          });
          
          showMessage("✅ Payment successful! Redirecting to phases...", true);
          
          // Redirect to phases after 2 seconds
          setTimeout(() => {
            window.location.href = "phases.html";
          }, 2000);
        } else {
          showMessage("❌ Insufficient main balance.", false);
        }
      } catch (error) {
        console.error("Error processing payment:", error);
        showMessage("❌ Error processing payment. Please try again.", false);
      }
    }

    // Pay with PayPal
    function payWithPaypal() {
      if (!currentUser) {
        showMessage("❌ Please log in first.", false);
        return;
      }

      alert("ℹ️ Full access to FluxiTrade can take up to 24 hours after successful payment.");
      window.location.href = "https://www.paypal.com/ncp/payment/8SRLDNT7NLACS";
    }

    // Listen for auth state
    firebase.auth().onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;
    });
  </script>

</body>
</html>
