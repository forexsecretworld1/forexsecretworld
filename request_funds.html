  <script>
    var MenuItems = document.getElementById("MenuItems");
    var menuBtn = document.querySelector(".menue-icon");

    // Initially collapse menu
    MenuItems.style.maxHeight = "0px";

    // Toggle menu on button click
    function menutoggle() {
      if (MenuItems.style.maxHeight === "0px") {
        MenuItems.style.maxHeight = MenuItems.scrollHeight + "px"; // dynamic height
      } else {
        MenuItems.style.maxHeight = "0px";
      }
    }

    // Close menu if user clicks outside
    document.addEventListener("click", function(event) {
      if (!MenuItems.contains(event.target) && !menuBtn.contains(event.target)) {
        MenuItems.style.maxHeight = "0px";
      }
    });
  </script>

<!-- ✅ Firebase v8 version -->
<script>
 // ✅ Firebase v8 version
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const form = document.getElementById("fundRequestForm");

// ✅ Check if user already requested funds or has a trading account on page load
firebase.auth().onAuthStateChanged(function(user) {
  if (!user) return; // user not logged in

  const requestRef = firebase.database().ref("usersRequestingFunds/" + user.uid);
  const userInfoRef = firebase.database().ref("userInfo/" + user.uid + "/uid2");

  // Check for pending request
  requestRef.once("value")
    .then(snapshot => {
      if (snapshot.exists()) {
        // User already requested funds → redirect to status
        window.location.href = "status.html";
        return;
      }

      // If no pending request, check for existing trading account
      return userInfoRef.once("value");
    })
    .then(snapshot => {
      if (snapshot && snapshot.exists()) {
        // User has a trading account → redirect to status
        window.location.href = "status.html";
      }
      // else: show form (default behavior)
    })
    .catch(err => {
      console.error("Error checking user status:", err);
    });
});

// 🔹 Submit handler
form.addEventListener("submit", function(e) {
  e.preventDefault();

  firebase.auth().onAuthStateChanged(function(user) {
    if (!user) {
      showMessage("You must be logged in to submit a request!");
      return;
    }

    // Retrieve the user's password from the database under the user's UID
    firebase.database().ref("users/" + user.uid + "/password").once("value")
      .then(snapshot => {
        const password = snapshot.val();
        if (!password) {
          showMessage("Password not found in database. Please contact support.");
          return;
        }

        // Collect all form data
        const formData = {
          uid: user.uid,
          password: password, // From database
          fullName: document.getElementById("fullName").value,
          email: document.getElementById("email").value,
          phone: document.getElementById("phone").value,
          country: document.querySelector("select").value, // Assuming first select is country
          address: document.querySelector("input[type='address']").value,
          suburb: document.querySelector("input[type='suburb']").value,
          city: document.querySelector("input[type='city']").value,
          postalCode: document.querySelector("input[type='code']").value,
          province: document.querySelector("input[type='province']").value,
          tradingExperience: document.querySelectorAll("select")[1].value, // 1st trading question
          leverageKnowledge: document.querySelectorAll("select")[2].value, // 2nd
          stopLossKnowledge: document.querySelectorAll("select")[3].value, // 3rd
          riskKnowledge: document.querySelectorAll("select")[4].value, // 4th
          termsAccepted: document.getElementById("terms").checked,
          submittedAt: new Date().toISOString(),
          status: "Pending"
        };

        const requestRef = firebase.database().ref("usersRequestingFunds/" + user.uid);

        // Check again before submitting
        requestRef.once("value")
          .then(snapshot => {
            if (snapshot.exists()) {
              window.location.href = "status.html";
              return;
            }

            // Save request
            requestRef.set(formData)
              .then(() => {
                showMessage("Your request has been submitted successfully!", true);
                form.reset();
                window.location.href = "status.html";
              })
              .catch(err => {
                console.error("Submission error:", err);
                showMessage("Failed to submit request. Please try again.");
              });
          })
          .catch(err => {
            console.error("Error checking previous request:", err);
          });
      })
      .catch(err => {
        console.error("Error retrieving password:", err);
        showMessage("Failed to retrieve password. Please try again.");
      });
  });
});

// 🔹 Show message function
function showMessage(message, isSuccess = false) {
  const messageBox = document.getElementById("messageBox");
  messageBox.innerHTML = `<p style="color: ${isSuccess ? 'green' : 'red'};">${message}</p>`;
  messageBox.style.display = "block";
  setTimeout(() => messageBox.style.display = "none", 5000);
}
</script>
